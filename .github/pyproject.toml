# CI tools, locked in uv.lock (updated by Dependabot). Relock: uv lock --project .github
[project]
name = "ci-tools"
version = "0"
requires-python = "==3.14.*"  # Latest version ansible-core supports
dependencies = [
  "ansible",
  "ansible-lint",
  "pyserial",  # Tested role scripts dependency
  "pytest",
  "radon",
  "ruff",
  "unidecode",  # Tested role scripts dependency
  "yamllint",
]

[tool.uv]
package = false
exclude-newer = "7 days"
