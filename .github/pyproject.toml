# CI tools, locked in uv.lock (updated by Dependabot). Relock: uv lock --project .github
[project]
name = "ci-tools"
version = "0"
requires-python = "==3.14.*"  # Latest version ansible-core supports
dependencies = [
  "ansible",
  "ansible-lint",
  "pyserial",  # Tested role scripts dependency
  "pytest",
  "radon",
  "ruff",
  "unidecode",  # Tested role scripts dependency
  "yamllint",
]

[tool.uv]
package = false
exclude-newer = "7 days"
# ansible 14 caps ansible-core at 2.21, which cannot run modules on Python 3.15 (Fedora 45). Drop once ansible 15 is out
override-dependencies = ["ansible-core==2.22.0"]
