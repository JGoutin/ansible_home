---
name: 'Code lint'

on:
  push:
    paths:
      - "**.yml"
      - "**.py"
      - ".ansible-lint"
      - ".yamllint.yml"
      - "ruff.toml"
      - ".github/pyproject.toml"
      - ".github/uv.lock"
      - ".github/workflows/lint.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.12.24"
          enable-cache: true
          cache-dependency-glob: .github/uv.lock

      - name: Install dependencies
        run: |
          uv sync --locked --project .github
          echo "$GITHUB_WORKSPACE/.github/.venv/bin" >> "$GITHUB_PATH"

      - name: Ansible code quality lint
        run: ansible-lint

      - name: Python code quality and security lint
        run: ruff check --output-format github .
        if: ${{ !cancelled() }}

      - name: Python code style lint
        run: ruff format --check --diff .
        if: ${{ !cancelled() }}

      - name: Python code maintainability
        run: radon mi -n B .
        if: ${{ !cancelled() }}

  publish:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'JGoutin/ansible_home' && github.ref_type == 'tag' }}
    needs: [static-analysis]
    environment: Ansible Galaxy
    permissions:
      contents: write  # Create the GitHub release
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.12.24"
          enable-cache: false  # No cache restored into release builds
          cache-dependency-glob: .github/uv.lock

      - name: Install dependencies
        run: |
          uv sync --locked --project .github
          echo "$GITHUB_WORKSPACE/.github/.venv/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag $VERSION is not X.Y.Z"; exit 1; }
          sed -i "s/^version: 0.0.0 /version: $VERSION /" galaxy.yml
          grep -q "^version: $VERSION " galaxy.yml || { echo "::error::galaxy.yml version not set"; exit 1; }
          ansible-galaxy collection build
        env:
          VERSION: ${{ github.ref_name }}

      - name: Publish to Ansible Galaxy
        run: ansible-galaxy collection publish "jgoutin-home-$VERSION.tar.gz" --token "$GALAXY_TOKEN"
        env:
          VERSION: ${{ github.ref_name }}
          GALAXY_TOKEN: ${{ secrets.ANSIBLE_GALAXY_TOKEN }}

      - name: Create the GitHub release
        run: gh release create "$VERSION" --verify-tag --generate-notes "jgoutin-home-$VERSION.tar.gz"
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
