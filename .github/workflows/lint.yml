---
name: 'Code lint'

on:
  push:
    paths:
      - "**.yml"
      - "**.py"
      - ".ansible-lint"
      - ".yamllint.yml"
      - "ruff.toml"
      - ".github/pyproject.toml"
      - ".github/uv.lock"
      - ".github/workflows/lint.yml"
      - "roles/musicplayer/files/musicplayer_serial_display_glyphs.txt"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.24"
          enable-cache: true
          cache-dependency-glob: .github/uv.lock

      - name: Install dependencies
        run: |
          uv sync --locked --project .github
          echo "$GITHUB_WORKSPACE/.github/.venv/bin" >> "$GITHUB_PATH"

      - name: Ansible code quality lint
        run: ansible-lint

      - name: Python code quality and security lint
        run: ruff check --output-format github .
        if: ${{ !cancelled() }}

      - name: Python code style lint
        run: ruff format --check --diff .
        if: ${{ !cancelled() }}

      - name: Python code maintainability
        run: radon mi -n B .
        if: ${{ !cancelled() }}

      - name: Python tests
        run: pytest -q -p no:cacheprovider tests/python
        if: ${{ !cancelled() }}

  publish:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'JGoutin/ansible_home' && github.ref_type == 'tag' }}
    needs: [static-analysis]
    environment: Ansible Galaxy
    permissions:
      contents: write  # Create the GitHub release
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.24"
          enable-cache: false  # No cache restored into release builds
          cache-dependency-glob: .github/uv.lock

      - name: Install dependencies
        run: |
          uv sync --locked --project .github
          echo "$GITHUB_WORKSPACE/.github/.venv/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag $VERSION is not X.Y.Z"; exit 1; }
          sed -i "s/^version: 0.0.0 /version: $VERSION /" galaxy.yml
          grep -q "^version: $VERSION " galaxy.yml || { echo "::error::galaxy.yml version not set"; exit 1; }
          ansible-galaxy collection build
        env:
          VERSION: ${{ github.ref_name }}

      # Each step can run again: a failed job is re-run from the start
      - name: Create the GitHub release as a draft
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release upload "$VERSION" "jgoutin-home-$VERSION.tar.gz" --clobber
          else
            gh release create "$VERSION" --draft --verify-tag --generate-notes "jgoutin-home-$VERSION.tar.gz"
          fi
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}

      - name: Publish to Ansible Galaxy
        run: |
          status=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 --retry 3 \
            "https://galaxy.ansible.com/api/v3/plugin/ansible/content/published/collections/index/jgoutin/home/versions/$VERSION/")
          case "$status" in
            200) echo "jgoutin.home $VERSION is already on Ansible Galaxy" ;;
            404) ansible-galaxy collection publish "jgoutin-home-$VERSION.tar.gz" --token "$GALAXY_TOKEN" ;;
            *) echo "::error::Ansible Galaxy answered HTTP $status"; exit 1 ;;
          esac
        env:
          VERSION: ${{ github.ref_name }}
          GALAXY_TOKEN: ${{ secrets.ANSIBLE_GALAXY_TOKEN }}

      - name: Publish the GitHub release
        run: gh release edit "$VERSION" --draft=false
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
