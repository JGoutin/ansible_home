---

- name: Ensure Remi signing keys are available
  ansible.builtin.dnf:
    install_weak_deps: false
    state: present
    name: distribution-gpg-keys
  retries: 10
  delay: 1
  register: _
  until: _ is successful
  when: (php_remi_repository | bool) or (php_hardening | bool)

- name: List Remi signing keys
  ansible.builtin.find:
    paths: /usr/share/distribution-gpg-keys/remi
    patterns: "RPM-GPG-KEY-remi20*"
  register: _remi_keys
  when: (php_remi_repository | bool) or (php_hardening | bool)

# Remi uses one key per year: trust the two newest from the Fedora-signed "distribution-gpg-keys"
- name: Ensure Remi signing keys are imported
  ansible.builtin.rpm_key:
    key: "{{ item }}"
  loop: "{{ (_remi_keys.files | map(attribute='path') | sort)[-2:] }}"
  when: (php_remi_repository | bool) or (php_hardening | bool)

- name: Ensure Remi repository is installed
  ansible.builtin.dnf:
    state: present
    name: "https://rpms.remirepo.net/fedora/remi-release-{{ ansible_facts['distribution_major_version'] }}.rpm"
    install_weak_deps: false
  retries: 10
  delay: 1
  register: _
  until: _ is successful
  when: (php_remi_repository | bool) or (php_hardening | bool)

- name: List PHP versions available on Remi repository
  ansible.builtin.command: "dnf module list php:remi-{{ php_version }}"
  changed_when: false
  check_mode: false
  register: _php_module_list
  when: (php_remi_repository | bool) or (php_hardening | bool)

- name: Get PHP streams packages versions
  ansible.builtin.command: "dnf -q module info php:remi-{{ item }}"
  loop: "{{ _php_module_list.stdout | ansible.builtin.regex_findall('remi-([0-9]+\\.[0-9]+)', multiline=True)
            | unique | community.general.version_sort }}"
  changed_when: false
  check_mode: false
  register: _php_module_info
  when: (php_remi_repository | bool) or (php_hardening | bool)

# Pre-release streams (php-common "8.6.0~RC3") are only used when requested explicitly, as "8.6"
- name: Get the latest PHP version matching the specification
  ansible.builtin.set_fact:
    _php_module: "remi-{{ (_php_module_info.results
                  | rejectattr('stdout', 'search', 'php-common-[0-9]+:[^-]*~') | map(attribute='item') | list
                  if php_version is not match('^[0-9]+\\.[0-9]+$')
                  else _php_module_info.results | map(attribute='item') | list) | last }}"
  when: (php_remi_repository | bool) or (php_hardening | bool)

- name: 'Ensure PHP is configured to modular repository "{{ _php_module }}"'
  ansible.builtin.command: "dnf module enable php:{{ _php_module }} -y --setopt=module_stream_switch=True"
  environment:
    LC_ALL: C
  changed_when: "'Nothing to do.' not in _php_module_enable.stdout"
  retries: 10
  delay: 1
  register: _php_module_enable
  until: _php_module_enable is successful
  when: (php_remi_repository | bool) or (php_hardening | bool)

- name: Check if PHP is installed
  ansible.builtin.command: rpm -q php-common  # noqa command-instead-of-module
  changed_when: false
  check_mode: false
  failed_when: _php_installed.rc not in [0, 1]
  register: _php_installed
  when: (php_remi_repository | bool) or (php_hardening | bool)

# "dnf distro-sync" fails when no package matches an installed one
- name: 'Ensure installed PHP packages match modular repository "{{ _php_module }}"'
  ansible.builtin.command: "dnf distro-sync 'php*' -y"
  environment:
    LC_ALL: C
  changed_when: "'Nothing to do.' not in _php_distro_sync.stdout"
  retries: 10
  delay: 1
  register: _php_distro_sync
  until: _php_distro_sync is successful
  when:
    - (php_remi_repository | bool) or (php_hardening | bool)
    - _php_installed.rc == 0
  notify: php_fpm_restarted

- name: Ensure PHP and its modules are installed
  ansible.builtin.dnf:
    state: present
    # php-opcache: a separate package before PHP 8.5, provided by php-common since
    name: "{{ ['php', 'php-common', 'php-fpm', 'php-opcache',
           ((php_hardening | bool) | ternary(['php-snuffleupagus'], [])),
           ['php'] | product(php_modules) | map('join', '-') | list] | flatten | unique }}"
    install_weak_deps: false
  retries: 10
  delay: 1
  register: _
  until: _ is successful
  notify: php_fpm_restarted

- name: Ensure Snuffleupagus is absent
  ansible.builtin.dnf:
    state: absent
    autoremove: true
    name: php-snuffleupagus
  when: not (php_hardening | bool)
  notify: php_fpm_restarted

- name: Netdata configuration
  ansible.builtin.include_tasks: netdata.yml
  when: common_netdata_enable | default(false) | bool

- name: Netdata configuration removal
  ansible.builtin.include_tasks: netdata_absent.yml
  when: not (common_netdata_enable | default(false) | bool)

- name: Ensure PHP site configuration is present
  ansible.builtin.template:
    src: site.ini.j2
    dest: "/etc/php.d/99-{{ php_fpm_site }}.ini"
  notify: php_fpm_restarted

- name: Ensure PHP security hardening configuration is present
  ansible.builtin.template:
    src: hardening.ini.j2
    dest: /etc/php.d/90-hardening.ini
  notify: php_fpm_restarted

- name: Check if PHP-FPM configuration was updated by RPM
  ansible.builtin.stat:
    path: /etc/php-fpm.conf.rpmnew
  register: php_fpm_conf_rpmnew

- name: Ensure latest PHP-FPM configuration from RPM is used
  ansible.builtin.copy:
    remote_src: true
    src: /etc/php-fpm.conf.rpmnew
    dest: /etc/php-fpm.conf
  when: php_fpm_conf_rpmnew.stat.exists
  notify: php_fpm_restarted

# Restores the packaged logging lines that earlier versions of the role edited
- name: Ensure packaged PHP-FPM logging settings are restored
  ansible.builtin.lineinfile:
    path: /etc/php-fpm.conf
    regexp: '{{ item.regexp }}'
    line: '{{ item.line }}'
  loop:
    - regexp: '^;?\s*error_log\s*='
      line: 'error_log = /var/log/php-fpm/error.log'
    - regexp: '^;?\s*log_level\s*='
      line: ';log_level = notice'
  notify: php_fpm_restarted

- name: Ensure PHP-FPM global configuration is present
  ansible.builtin.template:
    src: php-fpm-global.conf.j2
    dest: /etc/php-fpm.d/00-global.conf
  notify: php_fpm_restarted

- name: Ensure PHP-FPM site configuration is present
  ansible.builtin.template:
    src: php-fpm.conf.j2
    dest: "/etc/php-fpm.d/{{ php_fpm_site }}.conf"
  notify: php_fpm_restarted

# The pool cannot be disabled from another file: the packaged one is emptied
- name: Ensure PHP-FPM default site is disabled
  ansible.builtin.copy:
    dest: /etc/php-fpm.d/www.conf
    content: ""
  notify: php_fpm_restarted

# Earlier versions of the role emptied these packaged files
- name: Check emptied PHP-FPM web server files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/nginx/conf.d/php-fpm.conf
    - /etc/nginx/default.d/php.conf
    - /etc/httpd/conf.d/php.conf
  register: _php_web_server_files

- name: Ensure emptied PHP-FPM web server files are absent
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: absent
  loop: "{{ _php_web_server_files.results | selectattr('stat.exists') | selectattr('stat.size', 'eq', 0) | list }}"
  register: _php_web_server_files_removed

# RPM recreates a missing %config file when the package is reinstalled
- name: Ensure packaged PHP-FPM web server files are restored
  ansible.builtin.command: dnf -y reinstall php-fpm  # noqa command-instead-of-module
  register: _php_reinstall
  changed_when: _php_reinstall.rc == 0
  # The installed version may be gone from the repositories: RPM recreates the files on the next update
  failed_when: false
  when: _php_web_server_files_removed is changed  # noqa no-handler

- name: Ensure PHP-FPM service parent directory is present
  ansible.builtin.file:
    path: /etc/systemd/system/php-fpm.service.d
    state: directory

- name: Ensure PHP-FPM service configuration is present
  ansible.builtin.template:
    src: php-fpm_service.conf.j2
    dest: /etc/systemd/system/php-fpm.service.d/php-fpm.conf
  notify: php_fpm_restarted

- name: Ensure Fail2ban directory is present
  ansible.builtin.file:
    path: /etc/fail2ban/jail.d/
    state: directory

- name: Check the Fail2ban jail from a previous role version
  ansible.builtin.stat:
    path: /etc/fail2ban/jail.d/php.local
  register: _php_fpm_fail2ban_jail

# Its "php-url-fopen" jail matched web access logs, which the nginx role turns off
- name: Ensure Fail2ban jail from a previous role version is absent
  ansible.builtin.file:
    path: /etc/fail2ban/jail.d/php.local
    state: absent
  notify: fail2ban_reloaded
  when: _php_fpm_fail2ban_jail.stat.checksum | default('') == 'e97fe1cf166a62ab63b93bce89cd3f19cafd130c'

- name: Ensure security PHP-FPM package files metadata are in sync
  ansible.builtin.command: rpm --restore php-fpm php # noqa command-instead-of-module
  changed_when: false

- name: Ensure PHP-FPM service is started and enabled at boot
  ansible.builtin.systemd:
    name: php-fpm
    state: started
    enabled: true
    daemon_reload: true

- name: Ensure PHP-FPM "rpmnew" and "rpmsave" files are absent
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  with_items:
    - /etc/php-fpm.conf.rpmnew
    - /etc/php-fpm.conf.rpmsave
    - /etc/php-fpm.d/www.conf.rpmnew
    - /etc/php-fpm.d/www.conf.rpmsave
    - /etc/nginx/conf.d/php-fpm.conf.rpmnew
    - /etc/nginx/conf.d/php-fpm.conf.rpmsave
    - /etc/nginx/default.d/php.conf.rpmnew
    - /etc/nginx/default.d/php.conf.rpmsave
    - /etc/httpd/conf.d/php.conf.rpmnew
    - /etc/httpd/conf.d/php.conf.rpmsave
