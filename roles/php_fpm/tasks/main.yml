---

- name: Ensure Remi signing keys are available
  ansible.builtin.dnf:
    state: present
    name: distribution-gpg-keys
  retries: 10
  delay: 1
  register: _
  until: _ is successful
  when: (php_remi_repository | bool) or (php_hardening | bool)

- name: List Remi signing keys
  ansible.builtin.find:
    paths: /usr/share/distribution-gpg-keys/remi
    patterns: "RPM-GPG-KEY-remi20*"
  register: _remi_keys
  when: (php_remi_repository | bool) or (php_hardening | bool)

# Remi uses one key per year: trust the two newest from the Fedora-signed "distribution-gpg-keys"
- name: Ensure Remi signing keys are imported
  ansible.builtin.rpm_key:
    key: "{{ item }}"
  loop: "{{ (_remi_keys.files | map(attribute='path') | sort)[-2:] }}"
  when: (php_remi_repository | bool) or (php_hardening | bool)

- name: Ensure Remi repository is installed
  ansible.builtin.dnf:
    state: present
    name: "https://rpms.remirepo.net/fedora/remi-release-{{ ansible_facts['distribution_major_version'] }}.rpm"
    install_weak_deps: false
  retries: 10
  delay: 1
  register: _
  until: _ is successful
  when: (php_remi_repository | bool) or (php_hardening | bool)

- name: List PHP versions available on Remi repository
  ansible.builtin.command: "dnf module list php:remi-{{ php_version }}"
  changed_when: false
  register: _php_module_list
  when: (php_remi_repository | bool) or (php_hardening | bool)

- name: Get the latest PHP version matching the specification
  ansible.builtin.set_fact:
    _php_module: "remi-{{ _php_module_list.stdout | ansible.builtin.regex_findall('remi-([0-9]+\\.[0-9]+)', multiline=True)
                  | community.general.version_sort | last }}"
  when: (php_remi_repository | bool) or (php_hardening | bool)

- name: 'Ensure PHP is configured to modular repository "{{ _php_module }}"'
  ansible.builtin.command: "dnf module enable php:{{ _php_module }} -y --setopt=module_stream_switch=True"
  environment:
    LC_ALL: C
  changed_when: "'Nothing to do.' not in _php_module_enable.stdout"
  retries: 10
  delay: 1
  register: _php_module_enable
  until: _php_module_enable is successful
  when: (php_remi_repository | bool) or (php_hardening | bool)

- name: Check if PHP is installed
  ansible.builtin.command: rpm -q php-common  # noqa command-instead-of-module
  changed_when: false
  failed_when: _php_installed.rc not in [0, 1]
  register: _php_installed
  when: (php_remi_repository | bool) or (php_hardening | bool)

# "dnf distro-sync" fails when no package matches an installed one
- name: 'Ensure installed PHP packages match modular repository "{{ _php_module }}"'
  ansible.builtin.command: "dnf distro-sync 'php*' -y"
  environment:
    LC_ALL: C
  changed_when: "'Nothing to do.' not in _php_distro_sync.stdout"
  retries: 10
  delay: 1
  register: _php_distro_sync
  until: _php_distro_sync is successful
  when:
    - (php_remi_repository | bool) or (php_hardening | bool)
    - _php_installed.rc == 0
  notify: php_fpm_restarted

- name: Ensure PHP and its modules are installed
  ansible.builtin.dnf:
    state: present
    # php-opcache: a separate package before PHP 8.5, provided by php-common since
    name: "{{ ['php', 'php-common', 'php-fpm', 'php-opcache',
           ((php_hardening | bool) | ternary(['php-snuffleupagus'], [])),
           ['php'] | product(php_modules) | map('join', '-') | list] | flatten | unique }}"
    install_weak_deps: false
  retries: 10
  delay: 1
  register: _
  until: _ is successful
  notify: php_fpm_restarted

- name: Netdata configuration
  ansible.builtin.include_tasks: netdata.yml
  when: common_netdata_enable | default(false) | bool

- name: Ensure PHP site configuration is present
  ansible.builtin.template:
    src: site.ini.j2
    dest: "/etc/php.d/99-{{ php_fpm_site }}.ini"
  notify: php_fpm_restarted

- name: Ensure PHP security hardening configuration is present
  ansible.builtin.template:
    src: hardening.ini.j2
    dest: /etc/php.d/90-hardening.ini
  notify: php_fpm_restarted

- name: Check if PHP-FPM configuration was updated by RPM
  ansible.builtin.stat:
    path: /etc/php-fpm.conf.rpmnew
  register: php_fpm_conf_rpmnew

- name: Ensure latest PHP-FPM configuration from RPM is used
  ansible.builtin.copy:
    remote_src: true
    src: /etc/php-fpm.conf.rpmnew
    dest: /etc/php-fpm.conf
  when: php_fpm_conf_rpmnew.stat.exists
  notify: php_fpm_restarted

- name: Ensure PHP-FPM logs go to the journal
  ansible.builtin.lineinfile:
    path: /etc/php-fpm.conf
    regexp: '^;?\s*{{ item.option }}\s*='
    line: '{{ item.option }} = {{ item.value }}'
  with_items:
    - option: error_log
      value: syslog
    - option: log_level
      value: "{{ php_fpm_log_level }}"
  notify: php_fpm_restarted

- name: Ensure PHP-FPM site configuration is present
  ansible.builtin.template:
    src: php-fpm.conf.j2
    dest: "/etc/php-fpm.d/{{ php_fpm_site }}.conf"
  notify: php_fpm_restarted

- name: Ensure PHP-FPM default site is disabled
  ansible.builtin.copy:
    dest: "{{ item }}"
    content: ""
  with_items:
    - /etc/php-fpm.d/www.conf
    - /etc/nginx/conf.d/php-fpm.conf
    - /etc/nginx/default.d/php.conf
    - /etc/httpd/conf.d/php.conf
  notify: php_fpm_restarted

- name: Ensure PHP-FPM service parent directory is present
  ansible.builtin.file:
    path: /etc/systemd/system/php-fpm.service.d
    state: directory

- name: Ensure PHP-FPM service configuration is present
  ansible.builtin.template:
    src: php-fpm_service.conf.j2
    dest: /etc/systemd/system/php-fpm.service.d/php-fpm.conf
  notify: php_fpm_restarted

- name: Ensure Fail2ban directory is present
  ansible.builtin.file:
    path: /etc/fail2ban/jail.d/
    state: directory

- name: Ensure Fail2ban is configured
  ansible.builtin.copy:
    src: php.local
    dest: /etc/fail2ban/jail.d/php.local
  notify: fail2ban_reloaded

- name: Ensure security PHP-FPM package files metadata are in sync
  ansible.builtin.command: rpm --restore php-fpm php # noqa command-instead-of-module
  changed_when: false

- name: Ensure PHP-FPM service is started and enabled at boot
  ansible.builtin.systemd:
    name: php-fpm
    state: started
    enabled: true
    daemon_reload: true

- name: Ensure PHP-FPM "rpmnew" and "rpmsave" files are absent
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  with_items:
    - /etc/php-fpm.conf.rpmnew
    - /etc/php-fpm.conf.rpmsave
