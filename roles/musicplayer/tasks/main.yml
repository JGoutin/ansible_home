---

- name: Ensure musicplayer user is present
  ansible.builtin.user:
    name: musicplayer

- name: Ensure the music player and its dependencies are installed
  ansible.builtin.dnf:
    state: present
    name:
      - "{{ musicplayer_package }}"
      - alsa-utils
      - sway
      - plymouth-system-theme
      - polkit
      - playerctl
      - "@fonts"
  retries: 10
  delay: 1
  register: _
  until: _ is successful

- name: Ensure sound is managed by ALSA only
  ansible.builtin.dnf:
    state: "{{ musicplayer_alsa_only | bool | ternary('absent', 'present') }}"
    name:
      - pipewire
      - pipewire-alsa
      - pipewire-pulseaudio
  retries: 10
  delay: 1
  register: _
  until: _ is successful

- name: Ensure Sway configuration directory is present
  ansible.builtin.file:
    path: /home/musicplayer/.config/sway
    state: directory
    owner: musicplayer
    group: musicplayer

- name: Ensure Sway configuration is present
  ansible.builtin.template:
    src: config.j2
    dest: /home/musicplayer/.config/sway/config
    owner: musicplayer
    group: musicplayer

- name: Ensure ALSA configuration drop-in directory is present
  ansible.builtin.file:
    path: /etc/alsa/conf.d
    state: directory
    mode: "0755"

# Sorts after pipewire-alsa "99-pipewire-default.conf", which also sets the default device
- name: Ensure dmix is disabled in ALSA configuration
  ansible.builtin.copy:
    src: asound.conf
    dest: /etc/alsa/conf.d/99-zz-musicplayer.conf
    mode: "0644"

- name: Check if the ALSA configuration was updated by RPM
  ansible.builtin.stat:
    path: /etc/asound.conf.rpmnew
  register: _musicplayer_asound_rpmnew

- name: Ensure latest ALSA configuration from RPM is used
  ansible.builtin.copy:
    remote_src: true
    src: /etc/asound.conf.rpmnew
    dest: /etc/asound.conf
    mode: "0644"
  when: _musicplayer_asound_rpmnew.stat.exists

# Earlier versions of the role edited the packaged file
- name: Ensure dmix is no longer disabled in the packaged ALSA configuration
  ansible.builtin.replace:
    path: /etc/asound.conf
    regexp: "^pcm\\.!default \\{\\n type plug\\n slave\\.pcm hw\\n\\}\\n"
    replace: "#\n# Place your global alsa-lib configuration here...\n#\n"

- name: Ensure ALSA "rpmnew" and "rpmsave" files are absent
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  with_items:
    - /etc/asound.conf.rpmnew
    - /etc/asound.conf.rpmsave

- name: Ensure HDMI sound is disabled
  ansible.builtin.copy:
    src: alsa-blacklist.conf
    dest: /etc/modprobe.d/alsa-blacklist.conf
  when: musicplayer_disable_hdmi_sound | bool

- name: Ensure HDMI sound is not disabled
  ansible.builtin.file:
    path: /etc/modprobe.d/alsa-blacklist.conf
    state: absent
  when: not (musicplayer_disable_hdmi_sound | bool)

- name: Serial display configuration
  ansible.builtin.include_tasks: serial_display.yml
  when: musicplayer_serial_display | bool

- name: Ensure the serial display utility is absent
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  with_items:
    - /usr/local/bin/musicplayer_serial_display
    - /usr/local/share/musicplayer_serial_display
  when: not (musicplayer_serial_display | bool)

- name: Ensure musicplayer service unit is present
  ansible.builtin.template:
    src: musicplayer.service.j2
    dest: /etc/systemd/system/musicplayer.service
  notify: musicplayer_unit_changed

- name: Ensure previous getty-based configuration is absent
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  with_items:
    - /home/musicplayer/.bash_profile
    - /home/musicplayer/musicplayer.sh
    - /etc/systemd/system/getty@tty1.service.d/musicplayer.conf
    - /etc/systemd/system/getty@tty1.service.d/alsa-unmute.conf
    - /etc/systemd/system/getty@tty1.service.d

- name: Ensure systemd target is graphical.target
  ansible.builtin.file:
    src: /usr/lib/systemd/system/graphical.target
    dest: /etc/systemd/system/default.target
    state: link

- name: Ensure musicplayer service is enabled at boot
  ansible.builtin.systemd:
    name: musicplayer
    enabled: true

- name: Ensure musicplayer service is started
  ansible.builtin.systemd:
    name: musicplayer
    state: started
    daemon_reload: true
