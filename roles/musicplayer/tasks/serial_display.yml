---

- name: Ensure the serial display utility dependencies are installed
  ansible.builtin.dnf:
    install_weak_deps: false
    state: present
    name:
      - python3-pyserial
      - python3-gobject
      - python3-unidecode
      - kakasi
      - kakasi-dict
      - glibc-gconv-extra
  retries: 10
  delay: 1
  register: _
  until: _ is successful

- name: Ensure the serial display utility is present
  ansible.builtin.copy:
    src: musicplayer_serial_display.py
    dest: /usr/local/bin/musicplayer_serial_display
    owner: root
    group: root
    mode: "0755"

- name: Ensure the serial display custom characters directory is present
  ansible.builtin.file:
    path: /usr/local/share/musicplayer_serial_display
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure the serial display custom characters are present
  ansible.builtin.copy:
    src: musicplayer_serial_display_glyphs.txt
    dest: /usr/local/share/musicplayer_serial_display/glyphs.txt
    owner: root
    group: root
    mode: "0644"
