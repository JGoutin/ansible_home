---

- name: Ensure firewalld is installed
  ansible.builtin.dnf:
    state: present
    name: firewalld
    install_weak_deps: false
  retries: 10
  delay: 1

- name: Ensure Firewalld service is started and enabled at boot
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Ensure Squid firewalld service is present
  ansible.builtin.template:
    src: squid.xml.j2
    dest: /etc/firewalld/services/squid.xml
  register: _squid_firewalld_service

- name: Ensure Squid firewalld zone is present
  ansible.posix.firewalld:
    zone: "{{ squid_firewalld_zone }}"
    state: present
    permanent: true
  register: _squid_firewalld_zone
  when: squid_firewalld_source is defined

- name: Ensure Squid firewalld zone is absent
  ansible.posix.firewalld:
    zone: squid
    state: absent
    permanent: true
  register: _squid_firewalld_zone_absent
  when: squid_firewalld_source is not defined

- name: Ensure firewalld is reloaded
  ansible.builtin.command: firewall-cmd --reload
  changed_when: false
  when: >-  # noqa no-handler
    _squid_firewalld_service.changed or
    (_squid_firewalld_zone.changed | default(false)) or
    (_squid_firewalld_zone_absent.changed | default(false))

- name: Ensure source is defined in firewalld zone
  ansible.posix.firewalld:
    zone: "{{ squid_firewalld_zone }}"
    source: "{{ item }}"
    state: enabled
    permanent: true
    immediate: true
  with_items: "{{ squid_firewalld_source }}"
  when: squid_firewalld_source is defined

- name: Ensure firewalld allow proxy
  ansible.posix.firewalld:
    zone: "{{ squid_firewalld_zone }}"
    service: squid
    state: enabled
    permanent: true
    immediate: true

- name: Ensure public firewalld zone does not allow proxy
  ansible.posix.firewalld:
    zone: public
    service: squid
    state: disabled
    permanent: true
    immediate: true
  when: squid_firewalld_source is defined

- name: Ensure admin firewalld zone allow proxy
  ansible.posix.firewalld:
    zone: admin
    service: squid
    state: enabled
    permanent: true
    immediate: true
  when: common_trusted_firewalld_source is defined

- name: Get firewalld permanent zones
  ansible.builtin.command: firewall-cmd --permanent --get-zones
  register: _squid_firewalld_zones
  changed_when: false
  check_mode: false
  when: common_trusted_firewalld_source is not defined

- name: Ensure admin firewalld zone does not allow proxy
  ansible.posix.firewalld:
    zone: admin
    service: squid
    state: disabled
    permanent: true
    immediate: true
  when:
    - common_trusted_firewalld_source is not defined
    - "'admin' in _squid_firewalld_zones.stdout.split()"
