---

- name: Ensure Squid is installed
  ansible.builtin.dnf:
    install_weak_deps: false
    state: present
    name:
      - openssl
      - squid
  retries: 10
  delay: 1
  register: _
  until: _ is successful

- name: Netdata configuration
  ansible.builtin.include_tasks: netdata.yml
  when: common_netdata_enable | default(false) | bool

- name: Netdata configuration removal
  ansible.builtin.include_tasks: netdata_absent.yml
  when: not (common_netdata_enable | default(false) | bool)

- name: Ensure the specified Squid CA certificate is present
  ansible.builtin.copy:
    src: "{{ squid_ssl_bump_ca }}"
    dest: "{{ _tls_ca }}"
    owner: root
    group: squid
    mode: "0640"
  register: _squid_ca_copy
  when: squid_ssl_bump_ca is defined

- name: Ensure a generated Squid CA certificate is present
  ansible.builtin.command: "openssl req -new -x509 -days 3650 -nodes -extensions v3_ca
            -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -sha256
            -keyout {{ _tls_ca }} -out {{ _tls_ca }}
            -subj '/CN=Cache proxy'"
  args:
    creates: "{{ _tls_ca }}"
  register: _squid_ca_gen

- name: Ensure the generated Squid CA certificate permissions are set
  ansible.builtin.file:
    path: "{{ _tls_ca }}"
    owner: root
    group: squid
    mode: "0640"
  when: squid_ssl_bump_ca is not defined

- name: Get Squid CA certificate content
  ansible.builtin.command: "openssl x509 -in {{ _tls_ca }}"
  register: _squid_ca_cert
  changed_when: false

- name: CA certificate content
  ansible.builtin.debug:
    msg: "{{ _squid_ca_cert.stdout }}"

- name: Ensure Squid TLS database is reset on certificate change
  ansible.builtin.file:
    path: "{{ _tls_db }}"
    state: absent
  notify: squid_restarted
  when: _squid_ca_copy.changed or _squid_ca_gen.changed  # noqa no-handler

- name: Ensure Squid TLS database is initialized
  ansible.builtin.command: "/usr/lib64/squid/security_file_certgen -c -s {{ _tls_db }} -M 4MB"
  args:
    creates: "{{ _tls_db }}"

- name: Ensure Squid TLS database is configured
  ansible.builtin.file:
    path: "{{ _tls_db }}"
    state: directory
    owner: squid
    group: squid
    mode: "0750"
    setype: squid_cache_t
    recurse: true

- name: Ensure Squid DNF redirector utility is present
  ansible.builtin.copy:
    src: squid_dnf_redirector.py
    dest: /usr/local/bin/squid_dnf_redirector
    owner: root
    group: squid
    mode: "0750"
  notify: squid_restarted

- name: Check if Squid configuration was written by an earlier role version
  ansible.builtin.command: grep -q '^sslcrtd_program ' /etc/squid/squid.conf
  register: _squid_conf_legacy
  changed_when: false
  failed_when: _squid_conf_legacy.rc > 1
  check_mode: false

# An earlier role version replaced the whole packaged file; the RPM keeps an unmodified copy next to it
- name: Ensure packaged Squid configuration is available to replace the earlier role version one
  ansible.builtin.copy:
    remote_src: true
    src: /etc/squid/squid.conf.default
    dest: /etc/squid/squid.conf.rpmnew
    owner: root
    group: squid
    mode: "0640"
    force: false
  when: _squid_conf_legacy.rc == 0

- name: Check if Squid configuration was updated by RPM
  ansible.builtin.stat:
    path: /etc/squid/squid.conf.rpmnew
  register: _squid_conf_rpmnew

- name: Ensure latest Squid configuration from RPM is used
  ansible.builtin.copy:
    remote_src: true
    src: /etc/squid/squid.conf.rpmnew
    dest: /etc/squid/squid.conf
    owner: root
    group: squid
    mode: "0640"
  notify: squid_restarted
  when: _squid_conf_rpmnew.stat.exists

- name: Ensure Squid configuration directory is present
  ansible.builtin.file:
    path: /etc/squid/conf.d
    state: directory
    owner: root
    group: squid
    mode: "0750"

- name: Ensure Squid configuration is present
  ansible.builtin.template:
    src: squid.conf.j2
    dest: /etc/squid/conf.d/ansible.conf
    owner: root
    group: squid
    mode: "0640"
  notify: squid_restarted

# The role configuration is read first, so its rules are matched before the packaged ones
- name: Ensure Squid configuration includes the role configuration
  ansible.builtin.lineinfile:
    path: /etc/squid/squid.conf
    line: include /etc/squid/conf.d/*.conf
    insertbefore: BOF
  notify: squid_restarted

- name: Ensure packaged Squid settings replaced by the role configuration are disabled
  ansible.builtin.lineinfile:
    path: /etc/squid/squid.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  notify: squid_restarted
  with_items:
    - regexp: '^http_port 3128\s*$'
      line: "#http_port 3128"
    - regexp: '^coredump_dir '
      line: "#coredump_dir /var/spool/squid"

- name: Ensure Squid configuration is valid
  ansible.builtin.command: squid -k parse
  changed_when: false
  check_mode: false

- name: Ensure Squid service parent directory is present
  ansible.builtin.file:
    path: /etc/systemd/system/squid.service.d
    state: directory

- name: Ensure Squid systemd service configuration is present
  ansible.builtin.copy:
    src: squid_service.conf
    dest: /etc/systemd/system/squid.service.d/squid.conf
  notify: squid_restarted

- name: DNF mirrors configuration
  ansible.builtin.include_tasks: dnf_mirrors.yml

- name: SELinux configuration
  ansible.builtin.include_tasks: selinux.yml

- name: Firewall configuration
  ansible.builtin.include_tasks: firewall.yml

- name: Ensure security Squid package files metadata are in sync
  ansible.builtin.command: rpm --restore squid # noqa command-instead-of-module
  changed_when: false

- name: Ensure Squid configuration changes are applied
  ansible.builtin.meta: flush_handlers

- name: Ensure Squid service is started and enabled at boot
  ansible.builtin.systemd:
    name: squid
    state: started
    enabled: true
    daemon_reload: true

- name: Ensure Squid "rpmnew" and "rpmsave" files are absent
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  with_items:
    - /etc/squid/squid.conf.rpmnew
    - /etc/squid/squid.conf.rpmsave
