---

- name: Move the database directory from role < 1.3.0 to new the location if required
  block:
    - name: Ensure the database is not installed directly in data directory
      ansible.builtin.stat:
        path: "{{ postgresql_data }}/PG_VERSION"
      register: pg_version_120
      failed_when: pg_version_120.stat.exists
  rescue:
    - name: Move the database to a subdirectory
      ansible.builtin.command: "{{ item }}"
      args:
        creates: "{{ _data_subdir }}/PG_VERSION"
      with_items:
        - systemctl stop postgresql
        - 'mv "{{ postgresql_data }}" "{{ postgresql_data }}_tmp"'
        - 'mkdir "{{ postgresql_data }}"'
        - 'mv "{{ postgresql_data }}_tmp" "{{ _data_subdir }}"'

- name: Ensure PostgreSQL is installed from Fedora repository
  ansible.builtin.dnf:
    state: present
    name:
      - postgresql-server
      - postgresql-contrib
      - postgresql-upgrade
    install_weak_deps: false
  retries: 10
  delay: 1
  register: _
  until: _ is successful

- name: Ensure Required language packs are installed
  ansible.builtin.dnf:
    state: present
    name:
      - "glibc-langpack-{{ postgresql_local }}"
    install_weak_deps: false
  retries: 10
  delay: 1
  register: _
  until: _ is successful
  when: postgresql_local is defined

- name: Check if PostgreSQL database exists
  ansible.builtin.stat:
    path: "{{ _data_subdir }}/PG_VERSION"
  register: pg_version

- name: Get PostgreSQL database version
  ansible.builtin.slurp:
    src: "{{ _data_subdir }}/PG_VERSION"
  register: _pg_data_version
  when:
    - postgresql_upgrade | bool
    - pg_version.stat.exists

- name: Get PostgreSQL engine version
  ansible.builtin.command: /usr/bin/postgres --version
  changed_when: false
  register: _pg_engine_version
  when:
    - postgresql_upgrade | bool
    - pg_version.stat.exists

# "postgresql-setup --upgrade" also fails when the database is already up to date
- name: Ensure database version is up to date with PostgreSQL engine version
  ansible.builtin.command: /usr/bin/postgresql-setup --upgrade
  register: pg_upgrade
  changed_when: true
  when:
    - postgresql_upgrade | bool
    - pg_version.stat.exists
    - (_pg_data_version.content | b64decode | trim) !=
      (_pg_engine_version.stdout | regex_search('PostgreSQL\) (\d+)', '\\1') | first)

# The policy labels the default "/var/lib/pgsql" already
- name: Ensure PostgreSQL SELinux file context is persistent
  when: postgresql_data != "/var/lib/pgsql"
  block:
    - name: Ensure Ansible "python3-policycoreutils" requirement is installed
      ansible.builtin.dnf:
        state: present
        name: python3-policycoreutils
        install_weak_deps: false
      retries: 10
      delay: 1
      register: _
      until: _ is successful

    - name: Ensure PostgreSQL data SELinux file context is persistent
      community.general.sefcontext:
        target: "{{ postgresql_data }}(/.*)?"
        setype: postgresql_db_t
        state: present
      register: _postgresql_sefcontext

    - name: Ensure PostgreSQL data has its persistent SELinux file context
      ansible.builtin.command: "restorecon -i -R {{ postgresql_data }}"
      changed_when: true
      when: _postgresql_sefcontext is changed  # noqa no-handler (must run before the next tasks use the data)

- name: Ensure PostgreSQL data directory is present
  ansible.builtin.file:
    path: "{{ item }}"
    owner: postgres
    group: postgres
    state: directory
    mode: u=rwX,go=
    setype: postgresql_db_t
    recurse: true
  with_items:
    - "{{ postgresql_data }}"
    - "{{ _data_subdir }}"

- name: Ensure PostgreSQL data directory is inititialized
  ansible.builtin.command: "/usr/bin/initdb -D {{ _data_subdir }} --auth-local=peer --auth-host=scram-sha-256
            --encoding=UTF8 --locale={{ postgresql_locale }}"
  become: true
  become_user: postgres
  args:
    creates: "{{ _data_subdir }}/PG_VERSION"
  when: not pg_version.stat.exists

- name: Ensure PostgreSQL is configured to use unix socket only
  ansible.builtin.lineinfile:
    path: "{{ _data_subdir }}/postgresql.conf"
    regexp: "^{{ item.split(' ')[0] }} "
    line: "{{ item }}"
    create: true
  with_items:
    - "listen_addresses = ''"
    - "unix_socket_group = 'postgres_socket'"
    - "unix_socket_permissions = 0770"
    - "unix_socket_directories = '/var/run/postgresql'"
    - "password_encryption = scram-sha-256"
    - "log_connections = on"
    - "log_disconnections = on"
  notify: postgresql_restarted

- name: Ensure group postgres_socket exists
  ansible.builtin.group:
    name: postgres_socket
    state: present

- name: Ensure user is member of postgres_socket group
  ansible.builtin.user:
    name: "{{ postgresql_user }}"
    groups: postgres_socket
    append: true
  when: postgresql_user is defined

- name: Ensure postgres user is member of postgres_socket group
  ansible.builtin.user:
    name: postgres
    groups: postgres_socket
    append: true
  notify: postgresql_restarted

- name: Ensure PostgreSQL authentification is set to restricted peer
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ _data_subdir }}/pg_hba.conf"
  notify: postgresql_reloaded
  when: postgresql_user is defined

- name: Ensure PostgreSQL service parent directory is present
  ansible.builtin.file:
    path: /etc/systemd/system/postgresql.service.d
    state: directory

- name: Ensure PostgreSQL service configuration is present
  ansible.builtin.template:
    src: postgresql_service.conf.j2
    dest: /etc/systemd/system/postgresql.service.d/postgresql.conf
  notify: postgresql_restarted

- name: Ensure PostgreSQL service is started and enabled at boot
  ansible.builtin.systemd:
    name: postgresql
    state: started
    enabled: true
    daemon_reload: true

- name: Ensure Ansible "python3-psycopg2" requirement is installed
  ansible.builtin.dnf:
    state: present
    name: python3-psycopg2
    install_weak_deps: false
  retries: 10
  delay: 1
  register: pg_python3_psycopg2
  until: pg_python3_psycopg2 is successful

- name: Ensure PostgreSQL database user is present
  community.postgresql.postgresql_user:
    name: "{{ postgresql_user }}"
    state: present
    role_attr_flags: NOSUPERUSER,NOCREATEDB,NOCREATEROLE
  become: true
  become_user: postgres
  when: postgresql_user is defined

# Since PostgreSQL 15, only the database owner can create objects in schema "public"
- name: Ensure PostgreSQL database is present and owned by the database user
  community.postgresql.postgresql_db:
    name: "{{ postgresql_database }}"
    owner: "{{ postgresql_user | default(omit) }}"
    state: present
  become: true
  become_user: postgres
  when: postgresql_database is defined

- name: Ensure PostgreSQL database user has required permissions
  community.postgresql.postgresql_privs:
    login_db: "{{ postgresql_database }}"
    role: "{{ postgresql_user }}"
    type: database
    priv: ALL
    state: present
  become: true
  become_user: postgres
  when: postgresql_user is defined

# Databases upgraded from PostgreSQL < 15 keep a "public" schema owned by "postgres"
- name: Ensure PostgreSQL database user can create objects in schema "public"
  community.postgresql.postgresql_privs:
    login_db: "{{ postgresql_database }}"
    role: "{{ postgresql_user }}"
    type: schema
    objs: public
    priv: USAGE,CREATE
    state: present
  become: true
  become_user: postgres
  when: postgresql_user is defined

- name: Ensure other user cannot access the PostgreSQL database
  community.postgresql.postgresql_privs:
    login_db: "{{ postgresql_database }}"
    role: PUBLIC
    type: database
    priv: ALL
    state: absent
  become: true
  become_user: postgres
  when: postgresql_database is defined

- name: Ensure netdata database user is present
  community.postgresql.postgresql_user:
    name: netdata
    state: present
  become: true
  become_user: postgres
  when: common_netdata_enable | default(false) | bool

- name: Ensure netdata database user has required roles
  community.postgresql.postgresql_membership:
    target_roles: netdata
    group: pg_monitor
    state: present
  become: true
  become_user: postgres
  when: common_netdata_enable | default(false) | bool

- name: Ensure netdata database user has required permissions
  community.postgresql.postgresql_privs:
    login_db: "{{ postgresql_database }}"
    role: netdata
    type: database
    priv: CONNECT
    state: present
  become: true
  become_user: postgres
  when: common_netdata_enable | default(false) | bool

- name: Ensure collation version is refreshed
  community.postgresql.postgresql_query:
    login_db: "{{ postgresql_database }}"
    query: "ALTER DATABASE {{ postgresql_database }} REFRESH COLLATION VERSION"
  changed_when: false
  become: true
  become_user: postgres
  when: postgresql_database is defined

- name: Ensure database in properly indexed
  ansible.builtin.command: /usr/bin/reindexdb -a
  become: true
  become_user: postgres
  changed_when: false
  when: pg_upgrade is changed  # noqa no-handler (must run after the database tasks above, before the play ends)

- name: Netdata configuration
  ansible.builtin.include_tasks: netdata.yml
  when: common_netdata_enable | default(false) | bool
