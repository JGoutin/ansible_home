---

- name: Move the database directory from role < 1.3.0 to new the location if required
  block:
    - name: Ensure the database is not installed directly in data directory
      ansible.builtin.stat:
        path: "{{ postgresql_data }}/PG_VERSION"
      register: pg_version_120
      failed_when: pg_version_120.stat.exists
  rescue:
    - name: Move the database to a subdirectory
      ansible.builtin.command: "{{ item }}"
      args:
        creates: "{{ _data_subdir }}/PG_VERSION"
      with_items:
        - systemctl stop postgresql
        - 'mv "{{ postgresql_data }}" "{{ postgresql_data }}_tmp"'
        - 'mkdir "{{ postgresql_data }}"'
        - 'mv "{{ postgresql_data }}_tmp" "{{ _data_subdir }}"'

- name: Ensure PostgreSQL is installed from Fedora repository
  ansible.builtin.dnf:
    state: present
    name:
      - postgresql-server
      - postgresql-contrib
      - postgresql-upgrade
    install_weak_deps: false
  retries: 10
  delay: 1
  register: _
  until: _ is successful

- name: Ensure Required language packs are installed
  ansible.builtin.dnf:
    state: present
    name:
      - "glibc-langpack-{{ postgresql_local }}"
    install_weak_deps: false
  retries: 10
  delay: 1
  register: _
  until: _ is successful
  when: postgresql_local is defined

- name: Check if PostgreSQL database exists
  ansible.builtin.stat:
    path: "{{ _data_subdir }}/PG_VERSION"
  register: pg_version

- name: Get PostgreSQL database version
  ansible.builtin.slurp:
    src: "{{ _data_subdir }}/PG_VERSION"
  register: _pg_data_version
  when:
    - postgresql_upgrade | bool
    - pg_version.stat.exists

- name: Get PostgreSQL engine version
  ansible.builtin.command: /usr/bin/postgres --version
  changed_when: false
  check_mode: false
  register: _pg_engine_version
  when:
    - postgresql_upgrade | bool
    - pg_version.stat.exists

# "postgresql-setup --upgrade" also fails when the database is already up to date
- name: Ensure database version is up to date with PostgreSQL engine version
  ansible.builtin.command: /usr/bin/postgresql-setup --upgrade
  register: pg_upgrade
  changed_when: true
  when:
    - postgresql_upgrade | bool
    - pg_version.stat.exists
    - (_pg_data_version.content | b64decode | trim) !=
      (_pg_engine_version.stdout | regex_search('PostgreSQL\) (\d+)', '\\1') | first)

# The policy labels the default "/var/lib/pgsql" already
- name: Ensure PostgreSQL SELinux file context is persistent
  when: postgresql_data != "/var/lib/pgsql"
  block:
    - name: Ensure Ansible "python3-policycoreutils" requirement is installed
      ansible.builtin.dnf:
        state: present
        name: python3-policycoreutils
        install_weak_deps: false
      retries: 10
      delay: 1
      register: _
      until: _ is successful

    - name: Ensure PostgreSQL data SELinux file context is persistent
      community.general.sefcontext:
        target: "{{ postgresql_data }}(/.*)?"
        setype: postgresql_db_t
        state: present
      register: _postgresql_sefcontext

    - name: Ensure PostgreSQL data has its persistent SELinux file context
      ansible.builtin.command: "restorecon -i -R {{ postgresql_data }}"
      changed_when: true
      when: _postgresql_sefcontext is changed  # noqa no-handler (must run before the next tasks use the data)

# Role versions before the policy-labelled default path forced "postgresql_db_t" on every file
- name: Ensure PostgreSQL default data has its SELinux file contexts
  ansible.builtin.command: restorecon -R -v /var/lib/pgsql
  register: _postgresql_restorecon
  changed_when: _postgresql_restorecon.stdout != ''
  when:
    - postgresql_data == "/var/lib/pgsql"
    - ansible_facts['selinux']['status'] | default('disabled') == 'enabled'

- name: Ensure PostgreSQL data directory is present
  ansible.builtin.file:
    path: "{{ item }}"
    owner: postgres
    group: postgres
    state: directory
    mode: u=rwX,go=
    # The policy labels the default path itself (logs differ from data)
    setype: "{{ omit if postgresql_data == '/var/lib/pgsql' else 'postgresql_db_t' }}"
    recurse: true
  with_items:
    - "{{ postgresql_data }}"
    - "{{ _data_subdir }}"

# Role versions before "u=rwX" made every file executable by its owner
- name: Ensure PostgreSQL data files are not executable
  ansible.builtin.command: find {{ _data_subdir }} -type f -perm -0100 -print -exec chmod u-x {} +
  register: _postgresql_exec_bits
  changed_when: _postgresql_exec_bits.stdout != ''

- name: Ensure PostgreSQL data directory is inititialized
  ansible.builtin.command: "/usr/bin/initdb -D {{ _data_subdir }} --auth-local=peer --auth-host=scram-sha-256
            --encoding=UTF8 --locale={{ postgresql_locale }}"
  become: true
  become_user: postgres
  args:
    creates: "{{ _data_subdir }}/PG_VERSION"
  when: not pg_version.stat.exists

- name: Ensure PostgreSQL is configured to use unix socket only
  ansible.builtin.lineinfile:
    path: "{{ _data_subdir }}/postgresql.conf"
    regexp: "^{{ item.split(' ')[0] }} "
    line: "{{ item }}"
    create: true
  with_items:
    - "listen_addresses = ''"
    - "unix_socket_group = 'postgres_socket'"
    - "unix_socket_permissions = 0770"
    - "unix_socket_directories = '/var/run/postgresql'"
    - "password_encryption = scram-sha-256"
    - "log_connections = on"
    - "log_disconnections = on"
  notify: postgresql_restarted

- name: Ensure group postgres_socket exists
  ansible.builtin.group:
    name: postgres_socket
    state: present

- name: Ensure user is member of postgres_socket group
  ansible.builtin.user:
    name: "{{ postgresql_user }}"
    groups: postgres_socket
    append: true
  when: postgresql_user is defined

- name: Ensure postgres user is member of postgres_socket group
  ansible.builtin.user:
    name: postgres
    groups: postgres_socket
    append: true
  notify: postgresql_restarted

# The role owns pg_hba.conf while it carries its marker line or holds the exact output of an earlier version (a
# header, the "postgres" and user lines, and the "netdata" line with Netdata). Without "postgresql_user", a file
# written by the role is reset to the initdb default
- name: Read PostgreSQL authentification
  ansible.builtin.slurp:
    src: "{{ _data_subdir }}/pg_hba.conf"
  register: _postgresql_hba
  check_mode: false

- name: Check PostgreSQL authentification was written by the role
  ansible.builtin.set_fact:
    _postgresql_hba_managed: >-
      {{ '# Managed by the jgoutin.home.postgresql role' in (_postgresql_hba.content | b64decode).splitlines() or
         (_postgresql_hba.content | b64decode) is match(_postgresql_hba_legacy) }}
  vars:
    _postgresql_hba_legacy: >-
      # PostgreSQL Client Authentication Configuration File\n# =+\n\nlocal all postgres peer\nlocal \S+ \S+ peer\n\n(local all netdata peer\n)?$

- name: Ensure PostgreSQL authentification is set to restricted peer
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ _data_subdir }}/pg_hba.conf"
  notify: postgresql_reloaded
  when: postgresql_user is defined or _postgresql_hba_managed | bool

# Clusters initialized by role versions before the "--auth-local" option
- name: Ensure PostgreSQL local connections do not trust all users
  ansible.builtin.replace:
    path: "{{ _data_subdir }}/pg_hba.conf"
    regexp: '^(local\s+(?:all|replication)\s+all\s+)trust\s*$'
    replace: '\1peer'
  notify: postgresql_reloaded
  when: postgresql_user is not defined

- name: Ensure PostgreSQL network connections do not trust all users
  ansible.builtin.replace:
    path: "{{ _data_subdir }}/pg_hba.conf"
    regexp: '^(host\s+(?:all|replication)\s+all\s+(?:127\.0\.0\.1/32|::1/128)\s+)trust\s*$'
    replace: '\1scram-sha-256'
  notify: postgresql_reloaded
  when: postgresql_user is not defined

- name: Ensure PostgreSQL service parent directory is present
  ansible.builtin.file:
    path: /etc/systemd/system/postgresql.service.d
    state: directory

- name: Ensure PostgreSQL service configuration is present
  ansible.builtin.template:
    src: postgresql_service.conf.j2
    dest: /etc/systemd/system/postgresql.service.d/postgresql.conf
  notify: postgresql_restarted

- name: Ensure PostgreSQL service is started and enabled at boot
  ansible.builtin.systemd:
    name: postgresql
    state: started
    enabled: true
    daemon_reload: true

- name: Ensure Ansible "python3-psycopg2" requirement is installed
  ansible.builtin.dnf:
    state: present
    name: python3-psycopg2
    install_weak_deps: false
  retries: 10
  delay: 1
  register: pg_python3_psycopg2
  until: pg_python3_psycopg2 is successful

# In check mode, a psycopg2 install is only simulated, so the database modules cannot load
- name: Database and users configuration
  when: not (ansible_check_mode and pg_python3_psycopg2 is changed)
  block:
    - name: Ensure PostgreSQL database user is present
      community.postgresql.postgresql_user:
        name: "{{ postgresql_user }}"
        state: present
        role_attr_flags: NOSUPERUSER,NOCREATEDB,NOCREATEROLE
      become: true
      become_user: postgres
      when: postgresql_user is defined

    # Since PostgreSQL 15, only the database owner can create objects in schema "public"
    - name: Ensure PostgreSQL database is present and owned by the database user
      community.postgresql.postgresql_db:
        name: "{{ postgresql_database }}"
        owner: "{{ postgresql_user | default(omit) }}"
        state: present
      become: true
      become_user: postgres
      when: postgresql_database is defined

    - name: Ensure PostgreSQL database user has required permissions
      community.postgresql.postgresql_privs:
        login_db: "{{ postgresql_database }}"
        role: "{{ postgresql_user }}"
        type: database
        priv: ALL
        state: present
      become: true
      become_user: postgres
      when: postgresql_user is defined

    # Databases upgraded from PostgreSQL < 15 keep a "public" schema owned by "postgres"
    - name: Ensure PostgreSQL database user can create objects in schema "public"
      community.postgresql.postgresql_privs:
        login_db: "{{ postgresql_database }}"
        role: "{{ postgresql_user }}"
        type: schema
        objs: public
        priv: USAGE,CREATE
        state: present
      become: true
      become_user: postgres
      when: postgresql_user is defined

    - name: Ensure other user cannot access the PostgreSQL database
      community.postgresql.postgresql_privs:
        login_db: "{{ postgresql_database }}"
        role: PUBLIC
        type: database
        priv: ALL
        state: absent
      become: true
      become_user: postgres
      when: postgresql_database is defined

    - name: Ensure netdata database user is present
      community.postgresql.postgresql_user:
        name: netdata
        state: present
      become: true
      become_user: postgres
      when: common_netdata_enable | default(false) | bool

    - name: Ensure netdata database user has required roles
      community.postgresql.postgresql_membership:
        target_roles: netdata
        group: pg_monitor
        state: present
      become: true
      become_user: postgres
      when: common_netdata_enable | default(false) | bool

    - name: Ensure netdata database user has required permissions
      community.postgresql.postgresql_privs:
        login_db: "{{ postgresql_database }}"
        role: netdata
        type: database
        priv: CONNECT
        state: present
      become: true
      become_user: postgres
      when: common_netdata_enable | default(false) | bool

    - name: List databases whose collation version differs from the system C library one
      community.postgresql.postgresql_query:
        query: >-
          SELECT datname FROM pg_database WHERE datallowconn
          AND datcollversion IS DISTINCT FROM pg_database_collation_actual_version(oid)
      changed_when: false
      check_mode: false
      become: true
      become_user: postgres
      register: _postgresql_collation_outdated  # "query_result" is {} when no row matches

    # Text indexes built with the previous collation may be misordered: rebuild them before marking the version current
    - name: Ensure indexes of databases with an outdated collation version are rebuilt
      ansible.builtin.command: "/usr/bin/reindexdb -d {{ item.datname }}"
      changed_when: true
      become: true
      become_user: postgres
      loop: "{{ _postgresql_collation_outdated.query_result or [] }}"
      loop_control:
        label: "{{ item.datname }}"

    - name: Ensure collation version is refreshed
      community.postgresql.postgresql_query:
        login_db: "{{ item.datname }}"
        query: 'ALTER DATABASE "{{ item.datname }}" REFRESH COLLATION VERSION'
      become: true
      become_user: postgres
      loop: "{{ _postgresql_collation_outdated.query_result or [] }}"
      loop_control:
        label: "{{ item.datname }}"

- name: Ensure database in properly indexed
  ansible.builtin.command: /usr/bin/reindexdb -a
  become: true
  become_user: postgres
  changed_when: false
  when: pg_upgrade is changed  # noqa no-handler (must run after the database tasks above, before the play ends)

- name: Netdata configuration
  ansible.builtin.include_tasks: netdata.yml
  when: common_netdata_enable | default(false) | bool

- name: Netdata configuration is absent
  ansible.builtin.include_tasks: netdata_absent.yml
  when: not (common_netdata_enable | default(false) | bool)
