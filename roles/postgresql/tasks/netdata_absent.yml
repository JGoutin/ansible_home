---

# Revert only a collector file the role wrote: it carries the marker or holds the exact output of an earlier version
- name: Read Netdata collectors configuration
  ansible.builtin.slurp:
    src: /etc/netdata/go.d/postgres.conf
  register: _postgresql_netdata_conf
  failed_when: false
  check_mode: false

- name: Check Netdata collectors configuration is managed by the role
  ansible.builtin.set_fact:
    _postgresql_netdata_managed: >-
      {{ _postgresql_netdata_conf.content is defined and (
           (_postgresql_netdata_conf.content | b64decode).splitlines()[:1] == ['# Managed by the jgoutin.home.postgresql role'] or
           (postgresql_database is defined and (_postgresql_netdata_conf.content | b64decode) ==
             query('ansible.builtin.template', 'netdata_postgres.conf.j2')[0].splitlines(true)[1:] | join)
      ) }}

- name: Ensure netdata database user has no database permissions
  community.postgresql.postgresql_privs:
    login_db: "{{ postgresql_database }}"
    role: netdata
    type: database
    priv: CONNECT
    state: absent
    fail_on_role: false
  become: true
  become_user: postgres
  when:
    - _postgresql_netdata_managed | bool
    - postgresql_database is defined

# Dropping the role also removes its "pg_monitor" membership
- name: Ensure netdata database user is absent
  community.postgresql.postgresql_user:
    name: netdata
    state: absent
  become: true
  become_user: postgres
  when: _postgresql_netdata_managed | bool

- name: Get postgres_socket group members
  ansible.builtin.getent:
    database: group
    key: postgres_socket
  check_mode: false
  when: _postgresql_netdata_managed | bool

- name: Ensure netdata user is not member of postgres_socket group
  ansible.builtin.command: gpasswd -d netdata postgres_socket
  changed_when: true
  when:
    - _postgresql_netdata_managed | bool
    - "'netdata' in ansible_facts['getent_group']['postgres_socket'][2].split(',')"
  notify: netdata_restarted

# Last, so that a failed run is retried
- name: Ensure Netdata collectors configuration is absent
  ansible.builtin.file:
    path: /etc/netdata/go.d/postgres.conf
    state: absent
  when: _postgresql_netdata_managed | bool
  notify: netdata_restarted
