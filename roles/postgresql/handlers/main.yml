---

- name: Reload PostgreSQL
  ansible.builtin.systemd:
    name: postgresql
    state: reloaded
  listen: postgresql_reloaded

- name: Restart PostgreSQL
  ansible.builtin.systemd:
    name: postgresql
    state: restarted
    daemon_reload: true
  listen: postgresql_restarted

- name: Ensure Systemd Netdata service is restarted
  ansible.builtin.command: systemctl try-restart netdata  # noqa command-instead-of-module  # No try-restart in the systemd module
  changed_when: true
  listen: netdata_restarted
