---

- name: Ensure firewalld is installed
  ansible.builtin.dnf:
    state: present
    name: firewalld
    install_weak_deps: false
  retries: 10
  delay: 1

- name: Ensure Firewalld service is started and enabled at boot
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Ensure CoTURN firewalld service is present
  ansible.builtin.template:
    src: coturn.xml.j2
    dest: /etc/firewalld/services/coturn.xml
  register: _coturn_firewalld_service

- name: Ensure CoTURN firewalld zone is present
  ansible.posix.firewalld:
    zone: "{{ coturn_firewalld_zone }}"
    state: present
    permanent: true
  register: _coturn_firewalld_zone
  when: coturn_firewalld_source is defined

- name: Ensure CoTURN firewalld zone is absent
  ansible.posix.firewalld:
    zone: coturn
    state: absent
    permanent: true
  register: _coturn_firewalld_zone_absent
  when:
    - coturn_firewalld_source is not defined
    - coturn_firewalld_zone != 'coturn'

- name: Ensure firewalld is reloaded
  ansible.builtin.command: firewall-cmd --reload
  changed_when: false
  when: >-  # noqa no-handler
    _coturn_firewalld_service.changed or
    (_coturn_firewalld_zone.changed | default(false)) or
    (_coturn_firewalld_zone_absent.changed | default(false))

- name: Ensure source is defined in firewalld zone
  ansible.posix.firewalld:
    zone: "{{ coturn_firewalld_zone }}"
    source: "{{ item }}"
    state: enabled
    permanent: true
    immediate: true
  with_items: "{{ coturn_firewalld_source }}"
  when: coturn_firewalld_source is defined

- name: Ensure firewalld allow TURN
  ansible.posix.firewalld:
    zone: "{{ coturn_firewalld_zone }}"
    service: coturn
    state: enabled
    permanent: true
    immediate: true

- name: Ensure public firewalld zone does not allow TURN
  ansible.posix.firewalld:
    zone: public
    service: coturn
    state: disabled
    permanent: true
    immediate: true
  when: coturn_firewalld_zone != 'public'

- name: Ensure admin firewalld zone allow TURN
  ansible.posix.firewalld:
    zone: admin
    service: coturn
    state: enabled
    permanent: true
    immediate: true
  when: common_trusted_firewalld_source is defined

- name: Get firewalld permanent zones
  ansible.builtin.command: firewall-cmd --permanent --get-zones
  register: _coturn_firewalld_zones
  changed_when: false
  check_mode: false
  when: common_trusted_firewalld_source is not defined

- name: Ensure admin firewalld zone does not allow TURN
  ansible.posix.firewalld:
    zone: admin
    service: coturn
    state: disabled
    permanent: true
    immediate: true
  when:
    - common_trusted_firewalld_source is not defined
    - coturn_firewalld_zone != 'admin'
    - "'admin' in _coturn_firewalld_zones.stdout.split()"
