---

- name: Ensure MPD stays reachable
  ansible.builtin.assert:
    that: (mpd_default_permissions | length > 0) or (mpd_passwords is defined)
    fail_msg: An empty `mpd_default_permissions` denies all access without a password, define `mpd_passwords`.
    quiet: true

- name: Ensure MPD is installed
  ansible.builtin.dnf:
    install_weak_deps: false
    state: present
    name:
      - mpd
      - mpc
      - alsa-utils
  retries: 10
  delay: 1
  register: _
  until: _ is successful

# Earlier versions replaced the packaged file with a template. A reinstall keeps a modified
# file in place (no "mpd.conf.rpmnew" as the packaged file is unchanged), so set the former
# file aside for it, and put it back if the reinstall fails: the host never lacks a configuration.
- name: Check if MPD configuration is the former template
  ansible.builtin.lineinfile:
    path: /etc/mpd.conf
    regexp: '^# Configuration file for MPD\.$'
    state: absent
  check_mode: true
  changed_when: false
  register: _mpd_former_template

- name: Check if MPD packaged configuration is present
  ansible.builtin.stat:
    path: /etc/mpd.conf
  register: _mpd_conf

- name: Ensure MPD packaged configuration is restored
  when: (not _mpd_conf.stat.exists) or (_mpd_former_template.found | default(0) > 0)
  block:
    - name: Ensure former MPD template configuration is kept aside
      ansible.builtin.copy:
        remote_src: true
        src: /etc/mpd.conf
        dest: /etc/mpd.conf.former
        mode: preserve
      when: _mpd_conf.stat.exists

    - name: Ensure former MPD template configuration is removed
      ansible.builtin.file:
        path: /etc/mpd.conf
        state: absent

    # An update writes the missing file; a reinstall needs the installed version still in the repositories
    - name: Ensure MPD is up to date  # noqa package-latest
      ansible.builtin.dnf:
        name: mpd
        state: latest
        install_weak_deps: false
      retries: 10
      delay: 1
      register: _
      until: _ is successful

    - name: Check if the MPD update restored the packaged configuration
      ansible.builtin.stat:
        path: /etc/mpd.conf
      register: _mpd_conf_updated

    - name: Ensure MPD packaged configuration is reinstalled
      ansible.builtin.command: dnf reinstall -y mpd  # noqa command-instead-of-module
      changed_when: true
      when: not _mpd_conf_updated.stat.exists

    - name: Ensure former MPD template configuration copy is absent
      ansible.builtin.file:
        path: /etc/mpd.conf.former
        state: absent
  rescue:
    - name: Ensure former MPD template configuration is put back
      ansible.builtin.copy:
        remote_src: true
        src: /etc/mpd.conf.former
        dest: /etc/mpd.conf
        mode: preserve
      when: _mpd_conf.stat.exists

    - name: Ensure former MPD template configuration copy is absent after a failure
      ansible.builtin.file:
        path: /etc/mpd.conf.former
        state: absent

    - name: Report the failed MPD packaged configuration restore
      ansible.builtin.fail:
        msg: >-
          Reinstalling the mpd package failed: the former /etc/mpd.conf is kept
          and the role retries on its next run.

- name: Check if MPD configuration was updated by RPM
  ansible.builtin.stat:
    path: /etc/mpd.conf.rpmnew
  register: _mpd_conf_rpmnew

- name: Ensure latest MPD configuration from RPM is used
  ansible.builtin.copy:
    remote_src: true
    src: /etc/mpd.conf.rpmnew
    dest: /etc/mpd.conf
    mode: "0640"
  notify: mpd_restarted
  when: _mpd_conf_rpmnew.stat.exists

- name: Ensure MPD "rpmnew" and "rpmsave" files are absent
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  with_items:
    - /etc/mpd.conf.rpmnew
    - /etc/mpd.conf.rpmsave

- name: Ensure MPD configuration may hold passwords
  ansible.builtin.file:
    path: /etc/mpd.conf
    owner: root
    group: mpd
    mode: "0640"
  notify: mpd_restarted

- name: Ensure MPD is configured
  ansible.builtin.lineinfile:
    path: /etc/mpd.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  notify: mpd_restarted
  loop:
    - regexp: '^music_directory\s'
      line: 'music_directory "{{ mpd_music_directory }}"'
    # The packaged logrotate file only rotates /var/log/mpd/*.log
    - regexp: '^log_file\s'
      line: 'log_file "/var/log/mpd/mpd.log"'
    - regexp: '^#?default_permissions\s'
      line: 'default_permissions "{{ mpd_default_permissions }}"'
    - regexp: '^#?auto_update\s'
      line: 'auto_update "{{ mpd_auto_update | bool | ternary("yes", "no") }}"'
    - regexp: '^#?zeroconf_enabled\s'
      line: 'zeroconf_enabled "{{ mpd_zeroconf | bool | ternary("yes", "no") }}"'
    - regexp: '^#?replaygain\s'
      line: 'replaygain "{{ mpd_replaygain }}"'

- name: Ensure MPD passwords are configured
  ansible.builtin.blockinfile:
    path: /etc/mpd.conf
    marker: "# {mark} ANSIBLE passwords"
    insertafter: '^default_permissions\s'
    block: |
      {% for password in mpd_passwords | default([]) %}
      password "{{ password }}"
      {% endfor %}
    state: "{{ (mpd_passwords is defined) | ternary('present', 'absent') }}"
  no_log: true
  notify: mpd_restarted

- name: Ensure MPD input cache is configured
  ansible.builtin.blockinfile:
    path: /etc/mpd.conf
    marker: "# {mark} ANSIBLE input_cache"
    block: |
      input_cache {
          size "{{ mpd_input_cache | default('') }}"
      }
    state: "{{ (mpd_input_cache is defined) | ternary('present', 'absent') }}"
  notify: mpd_restarted

# Packaged "pulse" output is the only active audio_output block
- name: Ensure packaged MPD pulse audio output is disabled
  ansible.builtin.replace:
    path: /etc/mpd.conf
    after: 'pulseaudio output \(streaming to a remote pulseaudio server\)'
    before: '\n#audio_output \{'
    regexp: '^(?!#)(.+)$'
    replace: '#\1'
  notify: mpd_restarted

- name: Ensure MPD audio output is configured
  ansible.builtin.blockinfile:
    path: /etc/mpd.conf
    marker: "# {mark} ANSIBLE audio_output"
    block: |
      audio_output {
      {{ mpd_audio_output | regex_replace('\s+$', '') }}
      }
  notify: mpd_restarted

- name: Ensure MPD service directory is present
  ansible.builtin.file:
    path: /etc/systemd/system/mpd.service.d/
    state: directory

- name: Ensure ALSA unmute is enabled in MPD service
  ansible.builtin.template:
    src: alsa-unmute.conf.j2
    dest: "/etc/systemd/system/mpd.service.d/alsa-unmute.conf"
  notify: mpd_restarted

- name: Ensure SELinux booleans are configured for MPD
  ansible.posix.seboolean:
    name: "{{ item.name }}"
    state: "{{ item.state | default(true) }}"
    persistent: true
  with_items:
    - name: mpd_enable_homedirs
    - name: mpd_use_cifs
      state: "{{ mpd_use_cifs | bool }}"
    - name: mpd_use_nfs
      state: "{{ mpd_use_nfs | bool }}"

- name: Ensure mpd_selinux SELinux module is installed
  ansible.builtin.include_role:
    name: jgoutin.home.selinux_module
  vars:
    selinux_module_name: mpd_selinux

- name: Firewall configuration
  ansible.builtin.include_tasks: firewall.yml

- name: Ensure MPD socket service is started
  ansible.builtin.systemd:
    name: mpd.socket
    state: started
    enabled: true
    daemon_reload: true

# Restart MPD so the "mpc" call below uses the new passwords
- name: Ensure MPD configuration changes are applied
  ansible.builtin.meta: flush_handlers

- name: Ensure the MPD database is up to date
  ansible.builtin.command: "mpc {{ ('-P ' ~ (mpd_passwords[0].split('@')[0] | quote)) if mpd_passwords is defined else '' }} update"
  no_log: "{{ mpd_passwords is defined }}"
  when: mpd_update | bool
  changed_when: false

- name: Ensure MPC use password when called by admin user shell
  when:
    - ansible_user is defined
    - ansible_user != "root"
  block:
    - name: Get admin user account
      ansible.builtin.getent:
        database: passwd
        key: "{{ ansible_user }}"

    - name: Ensure MPC use password when called by admin user shell
      ansible.builtin.lineinfile:
        path: "{{ getent_passwd[ansible_user][4] }}/.bashrc"
        regexp: "^alias mpc="
        line: "alias mpc={{ ('mpc -P ' ~ (mpd_passwords[0].split('@')[0] | quote)) | quote }}"
        create: true
        owner: "{{ ansible_user }}"
        group: "{{ getent_passwd[ansible_user][2] }}"
        mode: "0600"  # Holds the MPD password
      no_log: true
      when: mpd_passwords is defined

    - name: Ensure MPC password alias is absent from admin user shell
      ansible.builtin.lineinfile:
        path: "{{ getent_passwd[ansible_user][4] }}/.bashrc"
        regexp: "^alias mpc='mpc -P "
        state: absent
      no_log: true
      when: mpd_passwords is not defined
