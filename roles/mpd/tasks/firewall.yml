---

- name: Ensure firewalld is installed
  ansible.builtin.dnf:
    state: present
    name: firewalld
    install_weak_deps: false
  retries: 10
  delay: 1

- name: Ensure Firewalld service is started and enabled at boot
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Ensure MPD firewalld zone is present
  ansible.posix.firewalld:
    zone: "{{ mpd_firewalld_zone }}"
    state: present
    permanent: true
  when: mpd_firewalld_source is defined

- name: Ensure firewalld is reloaded
  ansible.builtin.command: firewall-cmd --reload
  changed_when: false
  when: mpd_firewalld_source is defined

- name: Ensure MPD firewalld zone is absent
  ansible.posix.firewalld:
    zone: mpd
    state: absent
    permanent: true
  register: _mpd_zone_removed
  when: mpd_firewalld_source is not defined

- name: Ensure firewalld is reloaded after MPD zone removal
  ansible.builtin.command: firewall-cmd --reload
  changed_when: false
  when:
    - mpd_firewalld_source is not defined
    - _mpd_zone_removed is changed

- name: Ensure source is defined in firewalld zone
  ansible.posix.firewalld:
    zone: "{{ mpd_firewalld_zone }}"
    source: "{{ item }}"
    state: enabled
    permanent: true
    immediate: true
  with_items: "{{ mpd_firewalld_source }}"
  when: mpd_firewalld_source is defined

- name: Get MPD firewalld zone sources
  ansible.builtin.command: firewall-cmd --permanent --zone={{ mpd_firewalld_zone }} --list-sources
  register: _mpd_zone_sources
  changed_when: false
  check_mode: false
  failed_when: _mpd_zone_sources.rc != 0 and not ansible_check_mode
  when: mpd_firewalld_source is defined

- name: Ensure removed sources are absent from MPD firewalld zone
  ansible.posix.firewalld:
    zone: "{{ mpd_firewalld_zone }}"
    source: "{{ item }}"
    state: disabled
    permanent: true
    immediate: true
  loop: "{{ _mpd_zone_sources.stdout.split() | difference(mpd_firewalld_source) }}"
  when: mpd_firewalld_source is defined

- name: Ensure firewalld allow MPD
  ansible.posix.firewalld:
    zone: "{{ mpd_firewalld_zone }}"
    service: mpd
    state: enabled
    permanent: true
    immediate: true

# Without a source restriction MPD is allowed in the "internal" zone: close it there once a source is set
- name: Get services of the internal firewalld zone
  ansible.builtin.command: firewall-cmd --permanent --zone=internal --list-services
  register: _mpd_internal_services
  changed_when: false
  check_mode: false
  failed_when: _mpd_internal_services.rc != 0 and not ansible_check_mode
  when: mpd_firewalld_source is defined

- name: Ensure firewalld internal zone does not allow MPD
  ansible.posix.firewalld:
    zone: internal
    service: mpd
    state: disabled
    permanent: true
    immediate: true
  when:
    - mpd_firewalld_source is defined
    - "'mpd' in _mpd_internal_services.stdout.split()"

- name: Ensure admin firewalld zone allow MPD
  ansible.posix.firewalld:
    zone: admin
    service: mpd
    state: enabled
    permanent: true
    immediate: true
  when: common_trusted_firewalld_source is defined

- name: Ensure firewalld allow Zeroconf mDNS only when enabled
  ansible.posix.firewalld:
    zone: "{{ mpd_firewalld_zone }}"
    service: mdns
    state: "{{ mpd_zeroconf | bool | ternary('enabled', 'disabled') }}"
    permanent: true
    immediate: true
  when: (mpd_zeroconf | bool) or (mpd_firewalld_source is defined)
