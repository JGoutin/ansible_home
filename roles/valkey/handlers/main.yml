---

- name: Restart Valkey
  ansible.builtin.systemd:
    name: valkey
    state: restarted
    daemon_reload: true
  listen: valkey_restarted

- name: Restart Netdata
  ansible.builtin.command: systemctl try-restart netdata  # noqa command-instead-of-module  # No try-restart in the systemd module
  register: _netdata_restart
  changed_when: true
  # Exit code 5 means Netdata is not installed
  failed_when: _netdata_restart.rc not in [0, 5]
  listen: netdata_restarted
