---

# Revert only a collector file the role wrote: it carries the marker or holds the exact output of an earlier version
- name: Read Netdata collectors configuration
  ansible.builtin.slurp:
    src: /etc/netdata/go.d/redis.conf
  register: _valkey_netdata_conf
  failed_when: false
  check_mode: false

- name: Check Netdata collectors configuration is managed by the role
  ansible.builtin.set_fact:
    _valkey_netdata_managed: >-
      {{ _valkey_netdata_conf.content is defined and (
           (_valkey_netdata_conf.content | b64decode).splitlines()[:1] == ['# Managed by the jgoutin.home.valkey role'] or
           (_valkey_netdata_conf.content | b64decode) ==
             query('ansible.builtin.template', 'netdata_valkey.conf.j2')[0].splitlines(true)[1:] | join
      ) }}

- name: Get Valkey group members
  ansible.builtin.getent:
    database: group
    key: valkey
  check_mode: false
  when: _valkey_netdata_managed | bool

- name: Ensure netdata user is not member of valkey group
  ansible.builtin.command: gpasswd -d netdata valkey
  changed_when: true
  when:
    - _valkey_netdata_managed | bool
    - "'netdata' in ansible_facts['getent_group']['valkey'][2].split(',')"
  notify: netdata_restarted

# Last, so that a failed run is retried
- name: Ensure Netdata collectors configuration is absent
  ansible.builtin.file:
    path: /etc/netdata/go.d/redis.conf
    state: absent
  when: _valkey_netdata_managed | bool
  notify: netdata_restarted
