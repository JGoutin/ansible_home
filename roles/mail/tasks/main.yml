---

- name: Ensure Dovecot and Postfix are installed
  ansible.builtin.dnf:
    state: present
    name:
      - dovecot
      - openssl
      - postfix
    install_weak_deps: false
  retries: 10
  delay: 1
  register: _
  until: _ is successful

- name: Ensure mail users are present
  ansible.builtin.user:
    name: "{{ item.name }}"
    password: "{{ item.password }}"
    update_password: always
  no_log: true
  with_items: "{{ mail_users }}"
  when: mail_users is defined

- name: Check if aliases configuration was updated by RPM
  ansible.builtin.stat:
    path: /etc/aliases.rpmnew
  register: _aliases_rpmnew

- name: Ensure latest aliases configuration from RPM is used
  ansible.builtin.copy:
    remote_src: true
    src: /etc/aliases.rpmnew
    dest: /etc/aliases
  register: _aliases_rpmnew_copy
  when: _aliases_rpmnew.stat.exists

# Earlier role versions wrote the aliases in /etc/aliases, with this exact spacing, over the packaged
# line when the name was a packaged one. The root alias is left in place because the "common" role may
# have written it.
- name: Ensure packaged aliases written by earlier role versions are restored to the packaged ones
  ansible.builtin.replace:
    path: /etc/aliases
    regexp: '^{{ item.key }}: {11}\S.*$'
    replace: "{{ item.key }}:\t{{ item.value }}"
  register: _aliases_legacy_required
  loop: "{{ _mail_packaged_aliases | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Ensure other mail user aliases written by earlier role versions are absent
  ansible.builtin.lineinfile:
    path: /etc/aliases
    regexp: '^(?!(root|{{ _mail_packaged_aliases | list | join("|") }}):)[^#\s][^:]*: {11}\S'
    state: absent
  register: _aliases_legacy

- name: Ensure aliases "rpmnew" and "rpmsave" files are absent
  ansible.builtin.file:
    path: "/etc/aliases.{{ item }}"
    state: absent
  with_items:
    - rpmnew
    - rpmsave

- name: Ensure mail user aliases are set
  ansible.builtin.template:
    src: aliases.j2
    dest: /etc/postfix/aliases_ansible
    owner: root
    group: root
    mode: "0644"
  register: _postfix_aliases

- name: Ensure aliases RPM package files metadata are in sync
  ansible.builtin.command: rpm --restore setup # noqa command-instead-of-module
  changed_when: false

- name: TLS certificate configuration
  ansible.builtin.include_tasks: tls_certificates.yml

- name: SMTP server configuration
  ansible.builtin.include_tasks: postfix.yml

- name: IMAP/POP server configuration
  ansible.builtin.include_tasks: dovecot.yml

- name: Ensure Fail2ban directory is present
  ansible.builtin.file:
    path: /etc/fail2ban/jail.d/
    state: directory

- name: Ensure Fail2ban is configured
  ansible.builtin.copy:
    src: mail.local
    dest: /etc/fail2ban/jail.d/mail.local
  notify: fail2ban_reloaded

- name: Ensure services configuration changes are applied
  ansible.builtin.meta: flush_handlers

- name: Ensure Dovecot and Postfix services are started and enabled at boot
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  with_items:
    - dovecot
    - postfix

- name: Firewall configuration
  ansible.builtin.include_tasks: firewall.yml
