---

- name: Ensure firewalld is installed
  ansible.builtin.dnf:
    state: present
    name: firewalld
    install_weak_deps: false
  retries: 10
  delay: 1

- name: Ensure Firewalld service is started and enabled at boot
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Ensure Mail senders firewalld zone is present
  ansible.posix.firewalld:
    zone: "{{ mail_firewalld_senders_zone }}"
    state: present
    permanent: true
  register: _mail_senders_firewalld_zone
  when: mail_firewalld_senders_source is defined

- name: Ensure Mail senders firewalld zone is absent
  ansible.posix.firewalld:
    zone: mail_senders
    state: absent
    permanent: true
  register: _mail_senders_firewalld_zone_absent
  when:
    - mail_firewalld_senders_source is not defined
    - mail_firewalld_senders_zone != 'mail_senders'

- name: Ensure Mail readers firewalld zone is present
  ansible.posix.firewalld:
    zone: "{{ mail_firewalld_readers_zone }}"
    state: present
    permanent: true
  register: _mail_readers_firewalld_zone
  when: mail_firewalld_readers_source is defined

- name: Ensure Mail readers firewalld zone is absent
  ansible.posix.firewalld:
    zone: mail_readers
    state: absent
    permanent: true
  register: _mail_readers_firewalld_zone_absent
  when:
    - mail_firewalld_readers_source is not defined
    - mail_firewalld_readers_zone != 'mail_readers'

- name: Ensure firewalld is reloaded
  ansible.builtin.command: firewall-cmd --reload
  changed_when: false
  when: >-  # noqa no-handler
    (_mail_senders_firewalld_zone.changed | default(false)) or
    (_mail_readers_firewalld_zone.changed | default(false)) or
    (_mail_senders_firewalld_zone_absent.changed | default(false)) or
    (_mail_readers_firewalld_zone_absent.changed | default(false))

- name: Ensure source is defined in mail senders firewalld zone
  ansible.posix.firewalld:
    zone: "{{ mail_firewalld_senders_zone }}"
    source: "{{ item }}"
    state: enabled
    permanent: true
    immediate: true
  with_items: "{{ mail_firewalld_senders_source }}"
  when: mail_firewalld_senders_source is defined

- name: Ensure source is defined in mail readers firewalld zone
  ansible.posix.firewalld:
    zone: "{{ mail_firewalld_readers_zone }}"
    source: "{{ item }}"
    state: enabled
    permanent: true
    immediate: true
  with_items: "{{ mail_firewalld_readers_source }}"
  when: mail_firewalld_readers_source is defined

- name: Ensure public firewalld zone does not allow the enabled mail services of another zone
  ansible.posix.firewalld:
    zone: public
    service: "{{ item.service }}"
    state: disabled
    permanent: true
    immediate: true
  with_items: "{{ _mail_firewalld_services }}"
  when:
    - item.enabled | bool
    - (item.send | default(false) | ternary(mail_firewalld_senders_zone, mail_firewalld_readers_zone)) != 'public'

# A disabled service is closed only in the zones of the role: a shared zone may be opened by something else
- name: Ensure firewalld zones allow the enabled mail services
  ansible.posix.firewalld:
    zone: "{{ _zone }}"
    service: "{{ item.service }}"
    state: "{{ item.enabled | bool | ternary('enabled', 'disabled') }}"
    permanent: true
    immediate: true
  vars:
    _zone: "{{ item.send | default(false) | ternary(mail_firewalld_senders_zone, mail_firewalld_readers_zone) }}"
  with_items: "{{ _mail_firewalld_services }}"
  when: (item.enabled | bool) or _zone == (item.send | default(false) | ternary('mail_senders', 'mail_readers'))
