---

# Workaround: https://github.com/ansible/ansible/issues/10374
- name: Set static role path variable
  ansible.builtin.set_fact:
    nextcloud_role_path: "{{ role_path }}"

- name: Get Nextcloud config file information
  ansible.builtin.stat:
    path: /var/www/nextcloud/config/config.php
  register: _config_php

- name: Ensure Nextcloud user is present
  ansible.builtin.user:
    name: nextcloud

- name: Ensure Ansible "python3-policycoreutils" requirement is installed
  ansible.builtin.dnf:
    state: present
    name: python3-policycoreutils
    install_weak_deps: false
  retries: 10
  delay: 1
  register: _
  until: _ is successful

# The policy labels "/var/lib/nextcloud(/.*)?" for the web server, PostgreSQL data included
- name: Ensure Nextcloud SELinux file contexts are persistent
  community.general.sefcontext:
    target: "{{ item.path }}{{ '(/.*)?' if item.recurse else '' }}"
    setype: "{{ item.setype }}"
    state: present
  register: _nextcloud_sefcontext
  with_items:
    - path: /var/lib/nextcloud
      setype: var_lib_t
      recurse: false
    - path: /var/www/nextcloud
      setype: httpd_sys_rw_content_t
      recurse: true
    - path: /var/www/nextcloud/apps/notify_push/bin
      setype: bin_t
      recurse: true
    - path: /var/cache/nextcloud
      setype: httpd_sys_rw_content_t
      recurse: true
    - path: /home/nextcloud/.cache
      setype: httpd_sys_rw_content_t
      recurse: true

- name: Ensure Nextcloud files have their persistent SELinux file contexts
  ansible.builtin.command: "restorecon -i {{ '-R' if item.item.recurse else '' }} {{ item.item.path }}"
  changed_when: true
  loop: "{{ _nextcloud_sefcontext.results | selectattr('changed') | list }}"
  loop_control:
    label: "{{ item.item.path }}"

- name: Ensure Nextcloud var directory is present
  ansible.builtin.file:
    path: /var/lib/nextcloud
    mode: "0755"
    setype: var_lib_t
    state: directory

- name: Nextcloud installation
  ansible.builtin.include_tasks: install.yml

- name: Dependencies configuration
  ansible.builtin.include_tasks: dependencies.yml

- name: Application dependencies configuration
  ansible.builtin.include_tasks: dependencies_apps.yml

- name: Fail2ban configuration
  ansible.builtin.include_tasks: fail2ban.yml

- name: Nextcloud configuration
  ansible.builtin.include_tasks: config.yml

- name: Applications configuration
  ansible.builtin.include_tasks: config_apps.yml

- name: Maintenance tasks configuration
  ansible.builtin.include_tasks: maintenance.yml

- name: Ensure Nextcloud is properly optimized
  become: true
  become_user: nextcloud
  block:
    - name: Ensure Nextcloud maintenance mode is on
      ansible.builtin.command: /usr/bin/php occ -n maintenance:mode --on
      args:
        chdir: /var/www/nextcloud/
      changed_when: false

    - name: Ensure Nextcloud database is optimized
      ansible.builtin.command: "/usr/bin/php occ -n {{ item }}"
      args:
        chdir: /var/www/nextcloud/
      changed_when: false
      with_items:
        - db:add-missing-indices
        - db:add-missing-columns
        - db:add-missing-primary-keys
        - db:convert-filecache-bigint

    # Upgrades by nextcloud_update.service run "occ upgrade", which runs the other repair steps
    - name: Ensure new Nextcloud installation runs expensive repair steps
      ansible.builtin.command: /usr/bin/php occ -n maintenance:repair --include-expensive
      args:
        chdir: /var/www/nextcloud/
      changed_when: true
      when: not _config_php.stat.exists

  always:
    - name: Ensure Nextcloud maintenance mode is off
      ansible.builtin.command: /usr/bin/php occ -n maintenance:mode --off
      args:
        chdir: /var/www/nextcloud/
      changed_when: false
