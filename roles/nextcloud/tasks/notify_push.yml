---

# The push server calls Nextcloud at its public name, from the address it reaches it on, which must be a trusted proxy:
# its service sees this file as /etc/hosts, so it reaches Nextcloud over loopback
- name: Ensure the Client Push server resolves the Nextcloud domain to the loopback address
  ansible.builtin.copy:
    dest: /etc/nextcloud_notify_push.hosts
    content: |
      # Managed by the jgoutin.home.nextcloud role
      127.0.0.1   localhost {{ nextcloud_domain }}
      ::1         localhost
    mode: "0644"
  register: _nextcloud_notify_push_hosts

- name: Ensure Client Push service is present
  ansible.builtin.template:
    src: nextcloud_notify_push.service.j2
    dest: /etc/systemd/system/nextcloud_notify_push.service
    mode: "0644"
  register: _nextcloud_notify_push_unit

# In check mode, the application and the unit may not exist yet
- name: Ensure Client Push service is started and enabled at boot
  ansible.builtin.systemd:
    name: nextcloud_notify_push
    state: "{{ (_nextcloud_notify_push_unit is changed or _nextcloud_notify_push_hosts is changed) | ternary('restarted', 'started') }}"
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode

- name: Get Nextcloud trusted proxies
  ansible.builtin.command: /usr/bin/php occ -n config:system:get trusted_proxies --output=json
  args:
    chdir: /var/www/nextcloud/
  become: true
  become_user: nextcloud
  register: _nextcloud_trusted_proxies
  changed_when: false
  check_mode: false
  failed_when: _nextcloud_trusted_proxies.rc not in [0, 1]  # 1: not set

# An array with removed entries is printed as an object
- name: Ensure the Client Push server is a trusted proxy
  ansible.builtin.command: "/usr/bin/php occ -n config:system:set trusted_proxies {{ _next | int + index }} --value={{ item }}"
  args:
    chdir: /var/www/nextcloud/
  become: true
  become_user: nextcloud
  changed_when: true
  loop: "{{ ['127.0.0.1', '::1'] | difference(_existing) }}"
  loop_control:
    index_var: index
  vars:
    _proxies: "{{ (_nextcloud_trusted_proxies.stdout | default('', true) or '[]') | from_json }}"
    _existing: "{{ (_proxies.values() | list) if _proxies is mapping else _proxies }}"
    _next: "{{ (_proxies.keys() | map('int') | max + 1) if (_proxies is mapping and _proxies) else _proxies | length }}"

- name: Get Client Push endpoint
  ansible.builtin.command: /usr/bin/php occ -n config:app:get notify_push base_endpoint
  args:
    chdir: /var/www/nextcloud/
  become: true
  become_user: nextcloud
  register: _nextcloud_notify_push_endpoint
  changed_when: false
  check_mode: false
  failed_when: _nextcloud_notify_push_endpoint.rc not in [0, 1]  # 1: not set

- name: Ensure Client Push endpoint is configured
  ansible.builtin.command: "/usr/bin/php occ -n config:app:set notify_push base_endpoint --value={{ _endpoint }}"
  args:
    chdir: /var/www/nextcloud/
  become: true
  become_user: nextcloud
  changed_when: true
  when: _nextcloud_notify_push_endpoint.stdout != _endpoint
  vars:
    _endpoint: "https://{{ nextcloud_domain }}/push"

- name: Ensure the web server serves the Client Push route before testing it
  ansible.builtin.meta: flush_handlers

# Checks the whole chain: web server route, push server, database, Valkey and trusted proxy
- name: Ensure Client Push works
  ansible.builtin.command: /usr/bin/php occ -n notify_push:self-test
  args:
    chdir: /var/www/nextcloud/
  become: true
  become_user: nextcloud
  register: _nextcloud_notify_push_test
  changed_when: false
  retries: 5
  delay: 3
  until: _nextcloud_notify_push_test.rc == 0
  when: not ansible_check_mode
