---

- name: Ensure Fail2ban configuration directories are present
  ansible.builtin.file:
    path: "/etc/fail2ban/{{ item }}"
    state: directory
  with_items:
    - filter.d
    - jail.d

- name: Ensure Nextcloud Fail2ban filter and jail are configured
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/etc/fail2ban/{{ item.dst }}"
  with_items:
    - src: fail2ban_filter.conf
      dst: filter.d/nextcloud.conf
    - src: fail2ban_jail.local
      dst: jail.d/nextcloud.local
  notify: fail2ban_reloaded

- name: Ensure misplaced Nextcloud Fail2ban jail is absent
  ansible.builtin.file:
    path: /etc/fail2ban/filter.d/jail.local
    state: absent
  notify: fail2ban_reloaded
