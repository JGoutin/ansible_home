---

# rpm-ostree hosts boot from a configuration bootupd keeps: its static one, or the one generated before its migration.
# grub2-mkconfig is not supported there, so /etc/default/grub is not used
- name: Check if Grub default configuration was updated by RPM
  ansible.builtin.stat:
    path: /etc/default/grub.rpmnew
  register: _grub_default_rpmnew
  when: not (_ostree | bool)

- name: Ensure latest Grub default configuration from RPM is used
  ansible.builtin.copy:
    remote_src: true
    src: /etc/default/grub.rpmnew
    dest: /etc/default/grub
  register: _grub_default_rpmnew_copy
  when:
    - not (_ostree | bool)
    - _grub_default_rpmnew.stat.exists

- name: Ensure Grub options are configured
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    line: "{{ item.line }}"
    regexp: "{{ item.regexp }}"
    create: true
    state: "{{ (item.when | default(true)) | ternary('present', 'absent') }}"
  with_items:
    - line: 'GRUB_TIMEOUT="{{ common_grub_timeout }}"'
      regexp: "^GRUB_TIMEOUT="
    - line: "GRUB_TIMEOUT_STYLE=hidden"
      regexp: "^GRUB_TIMEOUT_STYLE="
      when: "{{ common_grub_auto_hide | bool }}"
    - line: 'GRUB_HIDDEN_TIMEOUT="{{ common_grub_hidden_timeout }}"'
      regexp: "^GRUB_HIDDEN_TIMEOUT="
      when: "{{ common_grub_auto_hide | bool }}"
    - line: 'GRUB_HIDDEN_TIMEOUT_QUIET="true"'
      regexp: "^GRUB_HIDDEN_TIMEOUT_QUIET="
      when: "{{ common_grub_auto_hide | bool }}"
    - line: 'GRUB_CMDLINE_LINUX_DEFAULT="{{ _grub_cmdline_linux_default | flatten | join(" ") }}"'
      regexp: "^GRUB_CMDLINE_LINUX_DEFAULT="
      when: "{{ (_grub_cmdline_linux_default | flatten | length) > 0 }}"
    - line: "GRUB_DEFAULT=saved"  # Left alone when the option is off: a person may have set another entry
      regexp: "^GRUB_DEFAULT="
      skip: "{{ not (common_grub_save_default | bool) }}"
    - line: "GRUB_SAVEDEFAULT=true"
      regexp: "^GRUB_SAVEDEFAULT="
      when: "{{ common_grub_save_default | bool }}"
  register: _grub_options
  when:
    - not (_ostree | bool)
    - not (item.skip | default(false) | bool)

# Honoured by configurations generated by grub2-mkconfig
- name: Ensure Grub auto hide is configured
  ansible.builtin.command: "grub2-editenv - {{ common_grub_auto_hide | bool |
            ternary('set menu_auto_hide=1', 'unset menu_auto_hide') }}"
  changed_when: false

- name: Check the Grub custom configuration
  ansible.builtin.stat:
    path: /boot/grub2/custom.cfg
  register: _grub_custom_cfg
  when: _ostree | bool

# Read last by both kinds of configuration, so it also replaces a request to show the menu once. A saved default entry
# is not set, as it would keep booting an older deployment after an update
- name: Ensure Grub menu is configured on rpm-ostree hosts
  ansible.builtin.blockinfile:
    path: /boot/grub2/custom.cfg
    marker: "# {mark} jgoutin.home.common Grub menu"
    create: true
    mode: "{{ _grub_custom_cfg.stat.exists | ternary(omit, '0600') }}"
    block: |
      {% if common_grub_auto_hide | bool %}
      set timeout_style=hidden
      set timeout={{ common_grub_hidden_timeout | int }}
      {% else %}
      set timeout={{ common_grub_timeout | int }}
      {% endif %}
    state: "{{ (_grub_menu_custom | bool) | ternary('present', 'absent') }}"
  when:
    - _ostree | bool
    - (_grub_menu_custom | bool) or _grub_custom_cfg.stat.exists
  vars:
    _grub_menu_custom: "{{ (common_grub_auto_hide | bool) or (common_grub_timeout | int) != 1 }}"

- name: Get current Kernel options
  ansible.builtin.command: rpm-ostree kargs
  register: _grub_current_kargs
  changed_when: false
  check_mode: false
  when: _ostree | bool

# Deletes the exact current token of managed options no longer wanted, or set to another value
- name: Ensure Grub Kernel options are configured
  ansible.builtin.command: "{{ ['rpm-ostree kargs --unchanged-exit-77',
                            ['--delete='] | product(_unwanted) | map('join', ''),
                            ['--append-if-missing='] | product(_wanted) | map('join', ''),
                            ['--delete-if-present='] | product(_kernel_cmdline_obsolete | difference(_wanted)) | map('join', '')]
                            | flatten | join(' ') }}"
  vars:
    _wanted: "{{ _grub_cmdline_linux_default | flatten }}"
    _managed_keys: "{{ (['mitigations', 'lockdown', 'nousb'] + _kernel_cmdline_hardening | map('regex_replace', '=.*$', '')) | unique }}"
    _unwanted: "{{ _grub_current_kargs.stdout.split() | reject('in', _wanted)
                   | select('match', '^(' ~ (_managed_keys | map('regex_escape') | join('|')) ~ ')(=|$)') | unique }}"
  register: _grub_kargs
  changed_when: _grub_kargs.rc == 0
  failed_when: _grub_kargs.rc not in [ 0, 77 ]
  when: _ostree | bool

- name: Ensure the Grub password is not empty
  ansible.builtin.assert:
    that: common_grub_password | length > 0
    fail_msg: "`common_grub_password` is empty: set a password or leave it undefined."
    quiet: true
  when: common_grub_password is defined

# Writes /boot/grub2/user.cfg as grub2-setpassword does, only when its hash does not match the password
- name: Ensure Grub password is set
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -I
      - -c
      - "{{ lookup('ansible.builtin.file', 'grub_password.py') }}"
      - /boot/grub2/user.cfg
    stdin: "{{ common_grub_password }}"
    stdin_add_newline: false
  register: _grub_password
  changed_when: _grub_password.stdout == 'changed'
  no_log: true
  when: common_grub_password is defined

- name: Ensure Grub password is unset
  ansible.builtin.file:
    path: /boot/grub2/user.cfg
    state: absent
  register: _grub_password_unset
  when: common_grub_password is not defined

- name: Ensure Grub configuration is applied
  ansible.builtin.command: grub2-mkconfig -o /boot/grub2/grub.cfg
  changed_when: false
  when:
    - not (_ostree | bool)
    - _grub_default_rpmnew_copy.changed or _grub_options.changed or _grub_password_unset.changed

- name: Ensure Grub RPM package files metadata are in sync
  ansible.builtin.command: rpm --restore grub2-tools # noqa command-instead-of-module
  changed_when: false

- name: Ensure Grub "rpmnew" and "rpmsave" files are absent
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  with_items:
    - /etc/default/grub.rpmnew
    - /etc/default/grub.rpmsave
