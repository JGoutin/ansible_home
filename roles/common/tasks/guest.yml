---

- name: Ensure Qemu guest agent is installed
  ansible.builtin.dnf:
    state: "{{ common_guest_qemu | bool | ternary('present', 'absent') }}"
    name: qemu-guest-agent
    install_weak_deps: false
  retries: 10
  delay: 1
  register: _
  until: _ is successful
  when: not (_ostree | bool)

- name: Ensure Qemu guest agent is installed
  ansible.builtin.include_tasks: ostree_packages.yml
  vars:
    _ostree_packages:
      - qemu-guest-agent
  when:
    - common_guest_qemu | bool
    - _ostree | bool

- name: Ensure Qemu guest agent is removed
  community.general.rpm_ostree_pkg:
    state: absent
    name: qemu-guest-agent
  when:
    - not (common_guest_qemu | bool)
    - _ostree | bool

- name: Ensure Incus guest agent is installed
  ansible.builtin.dnf:
    state: "{{ common_guest_incus | bool | ternary('present', 'absent') }}"
    name: incus-agent
    install_weak_deps: false
  retries: 10
  delay: 1
  register: _
  until: _ is successful
  when: not (_ostree | bool)

- name: Ensure Incus guest agent is installed
  ansible.builtin.include_tasks: ostree_packages.yml
  vars:
    _ostree_packages:
      - incus-agent
  when:
    - common_guest_incus | bool
    - _ostree | bool

- name: Ensure Incus guest agent is removed
  community.general.rpm_ostree_pkg:
    state: absent
    name: incus-agent
  when:
    - not (common_guest_incus | bool)
    - _ostree | bool
