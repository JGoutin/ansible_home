---

- name: Ensure resolved configuration directory is present
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory

- name: Ensure DNS resolver is configured
  community.general.ini_file:
    path: /etc/systemd/resolved.conf.d/dns.conf
    section: Resolve
    option: "{{ item.option }}"
    value: "{{ item.value | default(omit) }}"
    state: "{{ item.state | default('present') }}"
  with_items:
    - option: DNS
      value: "{{ common_dns_servers | default(omit) }}"
      state: "{{ (common_dns_servers is defined) | ternary('present', 'absent') }}"
    - option: FallbackDNS
      value: "{{ common_dns_servers_fallback | default(omit) }}"
      state: "{{ (common_dns_servers_fallback is defined) | ternary('present', 'absent') }}"
    - option: DNSOverTLS
      value: "{{ common_dns_over_tls }}"
    - option: DNSSEC
      value: "{{ common_dnssec | default(omit) }}"
      state: "{{ (common_dnssec is defined) | ternary('present', 'absent') }}"
    # Multicast name resolution answers any host on the link, which can spoof names
    - option: LLMNR
      value: "no"
      state: "{{ _multicast_dns_disabled | bool | ternary('present', 'absent') }}"
    - option: MulticastDNS
      value: "no"
      state: "{{ _multicast_dns_disabled | bool | ternary('present', 'absent') }}"
  register: _resolved_conf

- name: Ensure resolved is restarted
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
  when: _resolved_conf.changed  # noqa no-handler

- name: Ensure resolved is started
  ansible.builtin.systemd:
    name: systemd-resolved
    state: started

- name: Check if the Avahi mDNS responder is installed
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/avahi-daemon.service
  register: _avahi_unit

- name: Ensure Avahi mDNS responder drop-in directories are present without multicast DNS
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.d"
    state: directory
    mode: "0755"
  loop: "{{ _avahi_units }}"
  when: _multicast_dns_disabled | bool

# A start condition that never holds keeps both units down while leaving their packaged enablement untouched,
# also when Avahi is installed later
- name: Ensure Avahi mDNS responder cannot start without multicast DNS
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item }}.d/50-jgoutin-home.conf"
    content: |
      # Managed by the jgoutin.home.common role
      [Unit]
      ConditionPathExists=/nonexistent
    mode: "0644"
  loop: "{{ _avahi_units }}"
  register: _avahi_disabled
  when: _multicast_dns_disabled | bool

- name: Ensure Avahi mDNS responder start restriction is absent with multicast DNS
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.d/50-jgoutin-home.conf"
    state: absent
  loop: "{{ _avahi_units }}"
  register: _avahi_enabled
  when: not (_multicast_dns_disabled | bool)

- name: Ensure systemd configuration is reloaded after changing the Avahi start restriction
  ansible.builtin.systemd:
    daemon_reload: true
  when: _avahi_disabled.changed or _avahi_enabled.changed  # noqa no-handler

# try-restart stops a running unit, whose start condition then fails
- name: Ensure Avahi mDNS responder is stopped without multicast DNS
  ansible.builtin.command: systemctl try-restart avahi-daemon.socket avahi-daemon.service  # noqa command-instead-of-module
  changed_when: true
  when:
    - _avahi_unit.stat.exists
    - _avahi_disabled.changed  # noqa no-handler

- name: Ensure Avahi mDNS responder is started again when enabled, with multicast DNS
  ansible.builtin.shell: >-
    if systemctl -q is-enabled avahi-daemon.service; then
    systemctl start avahi-daemon.socket avahi-daemon.service; fi
  changed_when: true
  when:
    - _avahi_unit.stat.exists
    - _avahi_enabled.changed  # noqa no-handler

- name: Ensure host domain is set in /etc/hosts with localhost IPv6, or the packaged line is restored
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^::1\s+'
    line: "::1         localhost localhost.localdomain localhost6 localhost6.localdomain6{{ (' ' ~ common_domain) if common_domain is defined else '' }}"
    state: present
