---

- name: Ensure DNF CA certificates are present
  ansible.builtin.copy:
    src: "{{ common_dnf_sslcacert }}"
    dest: /etc/pki/tls/certs/dnf-ca-bundle.crt
  when: common_dnf_sslcacert is defined

- name: Check if DNF configuration was updated by RPM
  ansible.builtin.stat:
    path: /etc/dnf/dnf.conf.rpmnew
  register: _dnf_conf_rpmnew

- name: Ensure latest DNF configuration from RPM is used
  ansible.builtin.copy:
    remote_src: true
    src: /etc/dnf/dnf.conf.rpmnew
    dest: /etc/dnf/dnf.conf
  when: _dnf_conf_rpmnew.stat.exists

- name: Read the previous DNF drop-in
  ansible.builtin.slurp:
    src: /etc/dnf/libdnf5.conf.d/50-jgoutin-home.conf
  register: _dnf_dropin_previous
  failed_when: false
  no_log: true

- name: Ensure DNF is configured
  ansible.builtin.template:
    src: dnf-jgoutin-home.conf.j2
    dest: /etc/dnf/libdnf5.conf.d/50-jgoutin-home.conf
    owner: root
    group: root
    mode: "0644"
  diff: false
  no_log: "{{ common_dnf_proxy_password is defined }}"

# Options the role always writes: the drop-in supplies them
- name: Ensure DNF options moved to the drop-in are absent from the packaged configuration
  community.general.ini_file:
    path: /etc/dnf/dnf.conf
    section: main
    option: "{{ item }}"
    state: absent
  diff: false
  with_items:
    - max_parallel_downloads
    - fastestmirror
    - keepcache
    - install_weak_deps
    - gpgcheck
    - localpkg_gpgcheck

# Options written only when set: remove them from the packaged file when the drop-in now supplies them
- name: Ensure DNF optional options moved to the drop-in are absent from the packaged configuration
  community.general.ini_file:
    path: /etc/dnf/dnf.conf
    section: main
    option: "{{ item.option }}"
    state: absent
  diff: false
  no_log: "{{ item.option == 'proxy_password' }}"
  loop:
    - {option: proxy, when: "{{ common_dnf_proxy is defined }}"}
    - {option: proxy_auth_method, when: "{{ common_dnf_proxy_auth_method is defined }}"}
    - {option: proxy_username, when: "{{ common_dnf_proxy_username is defined }}"}
    - {option: proxy_password, when: "{{ common_dnf_proxy_password is defined }}"}
  loop_control:
    label: "{{ item.option }}"
  when: item.when | bool

- name: Ensure the DNF CA certificates option is absent from the packaged configuration
  community.general.ini_file:
    path: /etc/dnf/dnf.conf
    section: main
    option: sslcacert
    value: /etc/pki/tls/certs/dnf-ca-bundle.crt
    state: absent
    exclusive: false  # only the role's option=value line
    no_extra_spaces: true
  diff: false
  register: _dnf_conf_sslcacert_removed

- name: Ensure the DNF documentation option is absent from the packaged configuration
  community.general.ini_file:
    path: /etc/dnf/dnf.conf
    section: main
    option: tsflags
    value: nodocs
    state: absent
    exclusive: false  # only the role's option=value line
    no_extra_spaces: true
  diff: false
  when: common_dnf_nodocs | bool

# Only with proof that the role wrote the file: it set sslcacert in dnf.conf or in its previous drop-in
- name: Ensure DNF CA certificates are absent
  ansible.builtin.file:
    path: /etc/pki/tls/certs/dnf-ca-bundle.crt
    state: absent
  when:
    - common_dnf_sslcacert is not defined
    - (_dnf_conf_sslcacert_removed is changed) or
      ((_dnf_dropin_previous.content | default('') | b64decode) is search('(?m)^sslcacert=/etc/pki/tls/certs/dnf-ca-bundle.crt$'))

- name: Ensure python3-libdnf5 is present
  block:
    - name: Ensure python3-libdnf5 is present
      ansible.builtin.dnf:
        state: present
        name: python3-libdnf5
        install_weak_deps: false
  rescue:
    - name: Ensure python3-libdnf5 is present using CLI
      ansible.builtin.command: dnf install python3-libdnf5 -y
      changed_when: false

- name: Ensure DNF automatic is installed  # dnf5 has system-upgrade built in
  ansible.builtin.dnf:
    state: present
    name:
      - dnf-automatic
    install_weak_deps: false
  retries: 10
  delay: 1
  register: _
  until: _ is successful

- name: Check if DNF automatic configuration was updated by RPM
  ansible.builtin.stat:
    path: /etc/dnf/automatic.conf.rpmnew
  register: _dnf_automatic_conf_rpmnew

- name: Ensure latest DNF automatic configuration from RPM is used
  ansible.builtin.copy:
    remote_src: true
    src: /etc/dnf/automatic.conf.rpmnew
    dest: /etc/dnf/automatic.conf
  when: _dnf_automatic_conf_rpmnew.stat.exists

- name: Ensure DNF automatic is configured
  community.general.ini_file:
    path: /etc/dnf/automatic.conf
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
  with_items:
    - section: commands
      option: apply_updates
      value: "yes"
    - section: commands
      option: upgrade_type
      value: "{{ common_dnf_automatic_upgrade_type }}"
    - section: emitters
      option: emit_via
      value: email,stdio
    - section: email
      option: email_from
      value: root
    - section: command_email
      option: email_from
      value: root
    - section: commands
      option: reboot
      value: "{{ (_dnf_automatic_restart_install | bool) | ternary('when-needed', 'never') }}"

- name: Ensure dnf-automatic timer is configured
  ansible.builtin.systemd:
    name: dnf-automatic.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not (common_dnf_automatic_on_shutdown | bool)

- name: Ensure dnf-automatic timer is disabled
  ansible.builtin.systemd:
    name: dnf-automatic.timer
    enabled: false
    state: stopped
  when: common_dnf_automatic_on_shutdown | bool

- name: Ensure dnf-automatic-on-shutdown is installed
  ansible.builtin.copy:
    src: dnf-automatic-on-shutdown.service
    dest: /etc/systemd/system/dnf-automatic-on-shutdown.service
  when: common_dnf_automatic_on_shutdown | bool

- name: Ensure dnf-automatic-on-shutdown service is configured
  ansible.builtin.systemd:
    name: dnf-automatic-on-shutdown.service
    state: started
    enabled: true
    daemon_reload: true
  when: common_dnf_automatic_on_shutdown | bool

# The unit is not stopped: stopping it runs ExecStop, which installs updates
- name: Ensure dnf-automatic-on-shutdown service is not present
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  register: _dnf_automatic_on_shutdown_removed
  with_items:
    - /etc/systemd/system/multi-user.target.wants/dnf-automatic-on-shutdown.service
    - /etc/systemd/system/dnf-automatic-on-shutdown.service
  when: not (common_dnf_automatic_on_shutdown | bool)

- name: Ensure systemd is reloaded after dnf-automatic-on-shutdown removal
  ansible.builtin.systemd:
    daemon_reload: true
  when: _dnf_automatic_on_shutdown_removed is changed  # noqa no-handler

- name: Ensure no unrequired previous dependencies are installed
  ansible.builtin.dnf:
    autoremove: true
  retries: 10
  delay: 1
  register: _
  until: _ is successful

- name: Ensure DNF RPM package files metadata are in sync
  ansible.builtin.command: rpm --restore libdnf5 dnf5-plugin-automatic # noqa command-instead-of-module
  changed_when: false

- name: Ensure DNF "rpmnew" files are absent
  ansible.builtin.file:
    path: "{{ item }}.rpmnew"
    state: absent
  with_items:
    - /etc/dnf/automatic.conf
    - /etc/dnf/dnf.conf

- name: Ensure DNF "rpmsave" files are absent
  ansible.builtin.file:
    path: "{{ item }}.rpmsave"
    state: absent
  with_items:
    - /etc/dnf/automatic.conf
    - /etc/dnf/dnf.conf

- name: Ensure previous "dnf-automatic-restart" extra configuration is absent
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  with_items:
    - /usr/local/sbin/dnf-automatic-restart
    - /etc/systemd/system/dnf-automatic-install.service.d/dnf-automatic-restart.conf
    - /etc/systemd/system/dnf-automatic-install.service.d/
