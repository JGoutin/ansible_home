---

- name: Check if netdata is installed
  ansible.builtin.stat:
    path: /usr/lib/netdata/system/systemd/netdata.service
  register: _netdata_installed

- name: Ensure Netdata configuration directory is present
  ansible.builtin.file:
    path: /etc/netdata
    state: directory

- name: Ensure Netdata cloud configuration directory is present
  ansible.builtin.file:
    path: /var/lib/netdata/cloud.d
    state: directory
  when:
    - common_netdata_stream_destination is defined
    - common_netdata_claim_token is not defined

- name: Ensure Netdata stream is configured
  ansible.builtin.template:
    src: netdata_stream.conf.j2
    dest: /etc/netdata/stream.conf
    mode: '0644'
  diff: false
  register: _netdata_stream_conf
  when: common_netdata_stream_destination is defined

- name: Check the Netdata stream configuration
  ansible.builtin.stat:
    path: /etc/netdata/stream.conf
  register: _netdata_stream_conf_stat
  when: common_netdata_stream_destination is not defined

- name: Read the Netdata stream configuration
  ansible.builtin.slurp:
    src: /etc/netdata/stream.conf
  register: _netdata_stream_conf_content
  when:
    - common_netdata_stream_destination is not defined
    - _netdata_stream_conf_stat.stat.exists

# Only the file written by this role: carries the marker, or has the layout an earlier role version wrote
- name: Ensure Netdata stream configuration is absent
  ansible.builtin.file:
    path: /etc/netdata/stream.conf
    state: absent
  register: _netdata_stream_conf_removed
  vars:
    _content: "{{ _netdata_stream_conf_content.content | b64decode }}"
  when:
    - common_netdata_stream_destination is not defined
    - _netdata_stream_conf_stat.stat.exists
    - >-
      _content is search('^# Managed by the jgoutin.home.common role\n')
      or _content is match('\[stream\]\n    enabled = yes\n    destination = [^\n]*\n    api key = [^\n]*\n?\Z')

- name: Ensure Netdata cloud is disabled on Netdata thin child
  ansible.builtin.copy:
    src: netdata_cloud_disabled.conf
    dest: /var/lib/netdata/cloud.d/cloud.conf
    mode: '0644'
  register: _netdata_cloud_conf
  when:
    - common_netdata_stream_destination is defined
    - common_netdata_claim_token is not defined

- name: Check the Netdata cloud configuration
  ansible.builtin.stat:
    path: /var/lib/netdata/cloud.d/cloud.conf
    checksum_algorithm: sha1
  register: _netdata_cloud_conf_stat
  when: common_netdata_stream_destination is not defined or common_netdata_claim_token is defined

# Only the file written by this role: a claimed node has a cloud.conf written by Netdata
- name: Ensure Netdata cloud is not disabled when the node is not a thin child
  ansible.builtin.file:
    path: /var/lib/netdata/cloud.d/cloud.conf
    state: absent
  register: _netdata_cloud_conf_removed
  when:
    - common_netdata_stream_destination is not defined or common_netdata_claim_token is defined
    - _netdata_cloud_conf_stat.stat.exists
    - _netdata_cloud_conf_stat.stat.checksum == (lookup('ansible.builtin.file', 'netdata_cloud_disabled.conf') ~ '\n') | hash('sha1')

- name: Ensure Netdata telemetry is disabled
  ansible.builtin.file:
    path: /etc/netdata/.opt-out-from-anonymous-statistics
    state: touch
    mode: "0644"
    modification_time: preserve
    access_time: preserve

- name: Ensure DNF local package GPG check is not set in the packaged configuration
  community.general.ini_file:
    path: /etc/dnf/dnf.conf
    section: main
    option: localpkg_gpgcheck
    state: absent
  when: _ostree | bool

# An interrupted install leaves the temporary drop-in: remove it on every run, only with the role's content
- name: Check the temporary DNF drop-in
  ansible.builtin.stat:
    path: /etc/dnf/libdnf5.conf.d/99-netdata-install.conf
    checksum_algorithm: sha1
  register: _netdata_dnf_dropin

- name: Ensure the temporary DNF drop-in is absent
  ansible.builtin.file:
    path: /etc/dnf/libdnf5.conf.d/99-netdata-install.conf
    state: absent
  when:
    - _netdata_dnf_dropin.stat.exists
    - _netdata_dnf_dropin.stat.checksum in _netdata_dnf_dropin_checksums
  vars:
    _netdata_dnf_dropin_checksums:
      - "{{ '# Managed by the jgoutin.home.common role\n[main]\nlocalpkg_gpgcheck=0\n' | hash('sha1') }}"
      - "{{ '[main]\nlocalpkg_gpgcheck=0\n' | hash('sha1') }}"

- name: Ensure Netdata is installed
  when: not _netdata_installed.stat.exists
  block:
    - name: Ensure temporary directory is present
      ansible.builtin.tempfile:
        state: directory
      register: _netdata_tmp_dir

    - name: Download the installation script
      ansible.builtin.get_url:
        url: https://my-netdata.io/kickstart.sh
        dest: "{{ _netdata_tmp_dir.path }}/kickstart.sh"
        mode: "0700"

    - name: Ensure DNF local package GPG check is disabled temporary
      ansible.builtin.copy:
        content: "# Managed by the jgoutin.home.common role\n[main]\nlocalpkg_gpgcheck=0\n"
        dest: /etc/dnf/libdnf5.conf.d/99-netdata-install.conf
        mode: '0644'

    - name: Install Netdata
      ansible.builtin.command: "{{ _netdata_tmp_dir.path }}/kickstart.sh --no-cleanup {{ _netdata_kickstart_args | flatten | join(' ') }}"
      args:
        creates: /usr/lib/netdata/system/systemd/netdata.service
      no_log: "{{ common_netdata_claim_token is defined }}"

  always:
    - name: Ensure DNF local package GPG check is restored
      ansible.builtin.file:
        path: /etc/dnf/libdnf5.conf.d/99-netdata-install.conf
        state: absent

    - name: Ensure temporary directory is absent
      ansible.builtin.file:
        path: "{{ _netdata_tmp_dir.path }}"
        state: absent

- name: Ensure netdata plugins requirements are installed
  ansible.builtin.dnf:
    state: present
    name:
      - netdata-plugin-systemd-journal
      - netdata-plugin-systemd-units
      - lm_sensors
  retries: 10
  delay: 1
  register: _
  until: _ is successful

- name: Ensure sensor detection run
  ansible.builtin.command: sensors-detect --auto
  changed_when: false
  when: not (_kernel_modules_locked | bool)

- name: Check if Netdata configuration was updated by RPM
  ansible.builtin.stat:
    path: /etc/netdata/netdata.conf.rpmnew
  register: _netdata_conf_rpmnew

- name: Ensure latest Netdata configuration from RPM is used
  ansible.builtin.copy:
    remote_src: true
    src: /etc/netdata/netdata.conf.rpmnew
    dest: /etc/netdata/netdata.conf
    mode: '0644'
  register: _netdata_conf_rpmnew_copy
  when: _netdata_conf_rpmnew.stat.exists

- name: Ensure Netdata is configured
  community.general.ini_file:
    path: /etc/netdata/netdata.conf
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    state: "{{ (item.when | bool) | ternary('present', 'absent') }}"
    mode: '0644'
  register: _netdata_conf
  vars:
    _stream_child: "{{ common_netdata_stream_destination is defined and common_netdata_claim_token is not defined }}"
    _cloud_only: "{{ (common_netdata_cloud_only | bool) and common_netdata_claim_token is defined }}"
  loop:
    - {section: web, option: mode, value: none, when: "{{ (_stream_child | bool) or (_cloud_only | bool) }}"}
    - {section: logs, option: access, value: 'off', when: "{{ (_stream_child | bool) or (_cloud_only | bool) }}"}
    - {section: ml, option: enabled, value: 'no', when: "{{ _stream_child | bool }}"}
    - {section: health, option: enabled, value: 'no', when: "{{ _stream_child | bool }}"}
    - {section: db, option: mode, value: ram, when: "{{ _stream_child | bool }}"}
    - {section: global, option: is ephemeral node, value: 'yes', when: "{{ common_netdata_ephemeral_node | bool }}"}

- name: Ensure Netdata RPM package files metadata are in sync
  ansible.builtin.command: rpm --restore netdata # noqa command-instead-of-module
  changed_when: false

- name: Ensure Netdata "rpmnew" and "rpmsave" files are absent
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  with_items:
    - /etc/netdata/netdata.conf.rpmnew
    - /etc/netdata/netdata.conf.rpmsave

- name: Ensure Systemd Netdata service is restarted
  ansible.builtin.systemd:
    name: netdata
    state: restarted
  when: >-
    _netdata_conf_rpmnew_copy.changed or _netdata_conf.changed
    or _netdata_stream_conf.changed or _netdata_stream_conf_removed.changed
    or _netdata_cloud_conf.changed or _netdata_cloud_conf_removed.changed

- name: Ensure Systemd Netdata service is started
  ansible.builtin.systemd:
    name: netdata
    state: started
