---
# Reverts mail.yml. The role owns the setup when its postfix.service.d drop-in exists and no active relayhost line other
# than the role's own format (an empty one included) is present; a relay set by a person or by the mail role is left
# alone. The drop-in is removed only after Postfix restarted: it is the marker a failed run is retried from.

- name: Check if the role's Postfix service drop-in exists
  ansible.builtin.stat:
    path: /etc/systemd/system/postfix.service.d/postfix.conf
  register: _postfix_dropin

- name: Check if Postfix is configured
  ansible.builtin.stat:
    path: /etc/postfix/main.cf
  register: _postfix_main_cf_present

# Postfix was removed: only the drop-in, which belongs to no package, is left
- name: Ensure Postfix systemd service configuration of a removed Postfix is absent
  ansible.builtin.file:
    path: /etc/systemd/system/postfix.service.d/postfix.conf
    state: absent
  register: _postfix_dropin_orphan
  when:
    - _postfix_dropin.stat.exists
    - not _postfix_main_cf_present.stat.exists

- name: Ensure systemd configuration is reloaded after removing the orphan drop-in
  ansible.builtin.systemd:
    daemon_reload: true
  when: _postfix_dropin_orphan.changed  # noqa no-handler

- name: Check if Postfix has a relay host not set by this role
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: >-
      set -o pipefail;
      grep -E '^relayhost\s*=' /etc/postfix/main.cf | grep -qvE '^relayhost = \[[^]]+\]:[0-9]+$'
  register: _postfix_foreign_relay
  changed_when: false
  failed_when: _postfix_foreign_relay.rc > 1
  check_mode: false
  when:
    - _postfix_dropin.stat.exists
    - _postfix_main_cf_present.stat.exists

- name: Check if Postfix SASL passwords are set by this role
  ansible.builtin.command: grep -qxE 'smtp_sasl_password_maps = hash:/etc/postfix/sasl_passwd' /etc/postfix/main.cf
  register: _postfix_role_sasl
  changed_when: false
  failed_when: _postfix_role_sasl.rc > 1
  check_mode: false
  when:
    - _postfix_dropin.stat.exists
    - _postfix_main_cf_present.stat.exists

- name: Revert Postfix SMTP relay configuration
  when:
    - _postfix_dropin.stat.exists
    - _postfix_main_cf_present.stat.exists
    - _postfix_foreign_relay.rc == 1
  block:
    - name: Check if Postfix configuration was updated by RPM
      ansible.builtin.stat:
        path: /etc/postfix/main.cf.rpmnew
      register: postfix_main_cf_rpmnew

    - name: Ensure latest Postfix configuration from RPM is used
      ansible.builtin.copy:
        remote_src: true
        src: /etc/postfix/main.cf.rpmnew
        dest: /etc/postfix/main.cf
      when: postfix_main_cf_rpmnew.stat.exists

    - name: Ensure Postfix SASL password files are absent
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      register: _postfix_sasl_absent
      with_items:
        - /etc/postfix/sasl_passwd
        - /etc/postfix/sasl_passwd.db
      when: _postfix_role_sasl.rc == 0

    - name: Ensure Postfix SMTP relay configuration is reverted
      ansible.builtin.lineinfile:
        path: /etc/postfix/main.cf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line | default(omit) }}"
        state: "{{ item.state | default('present') }}"
      register: _postfix_main_cf
      with_items:
        - regexp: '^inet_interfaces\s*='
          line: "inet_interfaces = localhost"
        - regexp: '^smtp_tls_security_level\s*='
          line: "smtp_tls_security_level = may"
        - regexp: '^smtpd_tls_security_level\s*='
          line: "smtpd_tls_security_level = may"
        - regexp: '^tls_eecdh_auto_curves\s*='
          state: absent
        - regexp: '^smtp_tls_wrappermode\s*='
          state: absent
        - regexp: '^smtp_sasl_auth_enable\s*='
          state: absent
        - regexp: '^smtp_sasl_security_options\s*='
          state: absent
        - regexp: '^smtp_sasl_tls_security_options\s*='
          state: absent
        - regexp: '^smtp_sasl_password_maps\s*='
          state: absent

    - name: Check if Postfix aliases configuration was updated by RPM
      ansible.builtin.stat:
        path: /etc/aliases.rpmnew
      register: postfix_aliases_rpmnew

    - name: Ensure latest Postfix aliases configuration from RPM is used
      ansible.builtin.copy:
        remote_src: true
        src: /etc/aliases.rpmnew
        dest: /etc/aliases
      when: postfix_aliases_rpmnew.stat.exists

    - name: Ensure root mails redirection is reverted to the packaged line
      ansible.builtin.lineinfile:
        path: /etc/aliases
        regexp: "^#?root:"
        line: "#root:\t\tmarc"
      register: _postfix_aliases

    - name: Ensure Postfix aliases are reloaded
      ansible.builtin.command: newaliases
      changed_when: false
      when: _postfix_aliases.changed  # noqa no-handler

    - name: Ensure Postfix SMTP relay host is unset
      ansible.builtin.lineinfile:
        path: /etc/postfix/main.cf
        regexp: '^relayhost\s*=\s*\S'
        line: "#relayhost = [an.ip.add.ress]"
      register: _postfix_relayhost

    # Restart while the drop-in is still there: a failed restart keeps the marker and the next run retries
    - name: Ensure Postfix service is restarted
      ansible.builtin.command: systemctl try-restart postfix.service  # noqa command-instead-of-module
      changed_when: true
      register: _postfix_restarted
      failed_when: _postfix_restarted.rc not in [0, 5]

    - name: Ensure Postfix systemd service configuration is absent
      ansible.builtin.file:
        path: /etc/systemd/system/postfix.service.d/postfix.conf
        state: absent
      register: _postfix_systemd

    - name: Ensure systemd configuration is reloaded
      ansible.builtin.systemd:
        daemon_reload: true
      when: _postfix_systemd.changed  # noqa no-handler

    - name: Ensure Postfix service is restarted without the service configuration
      ansible.builtin.command: systemctl try-restart postfix.service  # noqa command-instead-of-module
      changed_when: true
      register: _postfix_restarted_dropin
      failed_when: _postfix_restarted_dropin.rc not in [0, 5]
      when: _postfix_systemd.changed  # noqa no-handler

    - name: Ensure Postfix "rpmnew" and "rpmsave" files are absent
      ansible.builtin.file:
        path: "{{ item.0 }}{{ item.1 }}"
        state: absent
      with_nested:
        - [/etc/postfix/main.cf, /etc/aliases]
        - [.rpmnew, .rpmsave]
