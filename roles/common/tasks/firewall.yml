---

- name: Ensure firewalld is installed
  ansible.builtin.dnf:
    state: present
    name: firewalld
    install_weak_deps: false
  retries: 10
  delay: 1
  when: not (_ostree | bool)

- name: Ensure firewalld is installed
  ansible.builtin.include_tasks: ostree_packages.yml
  vars:
    _ostree_packages:
      - firewalld
  when: _ostree | bool

- name: Ensure Firewalld service is started and enabled at boot
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Ensure admin firewalld zone is present
  ansible.posix.firewalld:
    zone: admin
    state: present
    permanent: true
  register: _firewalld_admin_zone
  when: common_trusted_firewalld_source is defined

- name: Ensure firewalld is reloaded
  ansible.builtin.command: firewall-cmd --reload
  changed_when: false
  when: _firewalld_admin_zone.changed  # noqa no-handler

- name: Ensure admin firewalld zone source is present
  ansible.posix.firewalld:
    zone: admin
    source: "{{ item }}"
    state: enabled
    permanent: true
    immediate: true
  with_items: "{{ common_trusted_firewalld_source }}"
  when: common_trusted_firewalld_source is defined

- name: Ensure admin firewalld zone allow SSH
  ansible.posix.firewalld:
    zone: admin
    service: ssh
    state: enabled
    permanent: true
    immediate: true
  when: common_trusted_firewalld_source is defined

- name: Get firewalld default zone
  ansible.builtin.command: firewall-cmd --get-default-zone
  changed_when: false
  failed_when: false
  check_mode: false
  register: _firewalld_default_zone

# sudo resets the environment under become: read the SSH connection as the login user
- name: Get the current SSH connection
  ansible.builtin.command: printenv SSH_CONNECTION
  become: false
  changed_when: false
  failed_when: false
  check_mode: false
  register: _ssh_connection

- name: Ensure the current SSH client is in a trusted source before restricting SSH
  ansible.builtin.command:
    argv: "{{ ['python3', '-I', '-c', _script, _ssh_connection.stdout.split()[0]] + ([common_trusted_firewalld_source] | flatten) }}"
  vars:
    _script: >-
      import ipaddress, sys;
      ip = ipaddress.ip_address(sys.argv[1]);
      sys.exit(0 if any(ip in ipaddress.ip_network(n, strict=False) for n in sys.argv[2:]) else 1)
  changed_when: false
  check_mode: false
  register: _ssh_client_trusted
  failed_when: _ssh_client_trusted.rc != 0
  when:
    - common_trusted_firewalld_source is defined
    - _ssh_connection.stdout | length > 0

- name: Get admin firewalld zone sources
  ansible.builtin.command: firewall-cmd --permanent --zone=admin --list-sources
  changed_when: false
  failed_when: false
  check_mode: false
  register: _firewalld_admin_sources
  when: common_trusted_firewalld_source is defined

- name: Ensure removed sources are absent from the admin firewalld zone
  ansible.posix.firewalld:
    zone: admin
    source: "{{ item }}"
    state: disabled
    permanent: true
    immediate: true
  with_items: "{{ _firewalld_admin_sources.stdout.split() | difference([common_trusted_firewalld_source] | flatten) }}"
  when: common_trusted_firewalld_source is defined

- name: Ensure public and default firewalld zones are configured
  ansible.posix.firewalld:
    zone: "{{ item }}"
    service: ssh
    state: "{{ common_trusted_firewalld_source is defined | ternary('disabled', 'enabled') }}"
    permanent: true
    immediate: true
  with_items: "{{ ['public', _firewalld_default_zone.stdout | default('', true) | trim | default('public', true)] | unique | reject('equalto', 'admin') }}"

- name: Ensure admin firewalld zone is absent
  ansible.posix.firewalld:
    zone: admin
    state: absent
    permanent: true
  register: _firewalld_admin_zone_absent
  when: common_trusted_firewalld_source is not defined

- name: Ensure firewalld is reloaded after the admin zone removal
  ansible.builtin.command: firewall-cmd --reload
  changed_when: false
  when: _firewalld_admin_zone_absent.changed  # noqa no-handler
