---

- name: Ensure extra CA certificates are present
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/pki/ca-trust/source/anchors/{{ item | basename }}"
  register: _ca_certificates
  with_items: "{{ common_ca_certificates }}"

- name: Ensure extra CA certificates from a previous role version are absent
  ansible.builtin.file:
    path: "/usr/share/pki/ca-trust-source/anchors/{{ item | basename }}"
    state: absent
  register: _ca_certificates_previous
  with_items: "{{ common_ca_certificates }}"
  when: not (_ostree | bool)

- name: Ensure system CA trust store is updated
  ansible.builtin.command: update-ca-trust
  changed_when: false
  when: _ca_certificates.changed or _ca_certificates_previous.changed  # noqa no-handler
