---

- name: Check if Chrony configuration was updated by RPM
  ansible.builtin.stat:
    path: /etc/chrony.conf.rpmnew
  register: chrony_conf_rpmnew

- name: Ensure latest Chrony configuration from RPM is used
  ansible.builtin.copy:
    remote_src: true
    src: /etc/chrony.conf.rpmnew
    dest: /etc/chrony.conf
  register: _chrony_conf_rpmnew_copy
  when: chrony_conf_rpmnew.stat.exists

- name: Ensure other NTP sources are absent
  ansible.builtin.lineinfile:
    path: /etc/chrony.conf
    regexp: "^(pool|server)\\s+(?!{{ common_ntp_server | default('') | regex_escape }}\\s)"
    state: absent
  register: _chrony_sources
  when: common_ntp_server is defined

- name: Ensure Chrony is configured
  ansible.builtin.lineinfile:
    path: /etc/chrony.conf
    regexp: "^{{ ((item.state | default('present')) == 'present') | ternary('#?', '') }}{{ item.line.split()[0] }}\\s"
    line: "{{ item.line }}"
    state: "{{ item.state | default('present') }}"
  register: _chrony_conf
  when: item.when | default(true)
  with_items:
    - line: "pool {{ common_ntp_server | default(None) }} iburst{{ common_nts | bool | ternary(' nts', '') }}"
      when: "{{ common_ntp_server is defined }}"
    - line: "authselectmode require"  # Only select NTS authenticated sources
      state: "{{ (common_ntp_server is defined and common_nts | bool) | ternary('present', 'absent') }}"
    - line: "nocerttimecheck 1"  # Allows the first NTS sync when the clock is wrong at boot
      state: "{{ (common_ntp_server is defined and common_nts | bool) | ternary('present', 'absent') }}"
    - line: "port 0"
    - line: "cmdport 0"

- name: Ensure Chrony RPM package files metadata are in sync
  ansible.builtin.command: rpm --restore chrony # noqa command-instead-of-module
  changed_when: false

- name: Ensure Chrony is restarted
  ansible.builtin.systemd:
    name: chronyd
    state: restarted
  when: _chrony_conf_rpmnew_copy.changed or _chrony_sources.changed or _chrony_conf.changed  # noqa no-handler

- name: Ensure Chrony is started
  ansible.builtin.systemd:
    name: chronyd
    state: started

- name: Ensure Chrony "rpmnew" and "rpmsave" files are absent
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  with_items:
    - /etc/chrony.conf.rpmnew
    - /etc/chrony.conf.rpmsave
