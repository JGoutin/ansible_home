---

- name: Ensure Postfix is installed
  ansible.builtin.dnf:
    state: present
    name: postfix
    install_weak_deps: false
  retries: 10
  delay: 1
  register: _
  until: _ is successful
  when: not (_ostree | bool)

- name: Ensure Postfix is installed
  ansible.builtin.include_tasks: ostree_packages.yml
  vars:
    _ostree_packages:
      - postfix
  when: _ostree | bool

- name: Ensure Postfix SASL support is installed
  ansible.builtin.dnf:
    state: present
    name: cyrus-sasl-plain
    install_weak_deps: false
  retries: 10
  delay: 1
  register: _
  until: _ is successful
  when:
    - common_mail_smtp_user is defined
    - not (_ostree | bool)

- name: Ensure Postfix SASL support is installed
  ansible.builtin.include_tasks: ostree_packages.yml
  vars:
    _ostree_packages:
      - cyrus-sasl-plain
  when:
    - common_mail_smtp_user is defined
    - _ostree | bool

- name: Ensure Postfix SASL password file exists
  ansible.builtin.template:
    src: sasl_passwd.j2
    dest: /etc/postfix/sasl_passwd
    owner: root
    group: root
    mode: '0600'
  diff: false
  register: _postfix_sasl_passwd
  when: common_mail_smtp_user is defined

- name: Check if Postfix SASL passwords are set by this role
  ansible.builtin.command: grep -qxE 'smtp_sasl_password_maps = hash:/etc/postfix/sasl_passwd' /etc/postfix/main.cf
  register: _postfix_role_sasl
  changed_when: false
  failed_when: _postfix_role_sasl.rc > 1
  check_mode: false
  when: common_mail_smtp_user is not defined

- name: Ensure Postfix SASL password files are absent
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  register: _postfix_sasl_absent
  with_items:
    - /etc/postfix/sasl_passwd
    - /etc/postfix/sasl_passwd.db
  when:
    - common_mail_smtp_user is not defined
    - _postfix_role_sasl.rc == 0

- name: Check if Postfix configuration was updated by RPM
  ansible.builtin.stat:
    path: /etc/postfix/main.cf.rpmnew
  register: postfix_main_cf_rpmnew

- name: Ensure latest Postfix configuration from RPM is used
  ansible.builtin.copy:
    remote_src: true
    src: /etc/postfix/main.cf.rpmnew
    dest: /etc/postfix/main.cf
  when: postfix_main_cf_rpmnew.stat.exists

- name: Ensure Postfix SMTP relay is configured
  ansible.builtin.lineinfile:
    path: /etc/postfix/main.cf
    regexp: "^{{ ((item.state | default('present')) == 'present') | ternary('#?', '') }}{{ item.line.split('=')[0] }}="
    line: "{{ item.line }}"
    state: "{{ item.state | default('present') }}"
    firstmatch: "{{ item.firstmatch | default(false) }}"
  with_items:
    - line: "relayhost = {{ _smtp_server }}"
    - line: "inet_interfaces = {{ common_mail_smtp_inet_interfaces }}"
    - line: "smtp_sasl_auth_enable = yes"
      state: "{{ (common_mail_smtp_user is defined) | ternary('present', 'absent') }}"
    - line: "smtp_sasl_security_options = noanonymous, noplaintext"
      state: "{{ (common_mail_smtp_user is defined) | ternary('present', 'absent') }}"
    - line: "smtp_sasl_tls_security_options = noanonymous"
      state: "{{ (common_mail_smtp_user is defined) | ternary('present', 'absent') }}"
    - line: "smtp_sasl_password_maps = hash:/etc/postfix/sasl_passwd"
      state: "{{ (common_mail_smtp_user is defined) | ternary('present', 'absent') }}"
    - line: "smtp_tls_wrappermode = {{ (common_mail_smtp_tls == 'TLS') |
             ternary('yes', 'no') }}"
    # TLS wrapper mode requires "encrypt" or stronger
    - line: "smtp_tls_security_level = {{ (common_mail_smtp_user is defined or common_mail_smtp_tls == 'TLS') |
             ternary('encrypt', 'may') }}"
  register: _postfix_main_cf

- name: Ensure deprecated Postfix TLS parameters are absent
  ansible.builtin.lineinfile:
    path: /etc/postfix/main.cf
    regexp: "^smtp_use_tls\\s*="
    state: absent
  register: _postfix_main_cf_deprecated

- name: Ensure postfix service is started and enabled at boot
  ansible.builtin.systemd:
    name: postfix
    state: started
    enabled: true

- name: Check if Postfix aliases configuration was updated by RPM
  ansible.builtin.stat:
    path: /etc/aliases.rpmnew
  register: postfix_aliases_rpmnew

- name: Ensure latest Postfix aliases configuration from RPM is used
  ansible.builtin.copy:
    remote_src: true
    src: /etc/aliases.rpmnew
    dest: /etc/aliases
  when: postfix_aliases_rpmnew.stat.exists

- name: Ensure root mails redirection is configured
  ansible.builtin.lineinfile:
    path: /etc/aliases
    regexp: "^#?root:"
    line: "root:           {{ common_mail_smtp_send_to }}"
  register: _postfix_aliases
  when: common_mail_smtp_send_to is defined

- name: Ensure root mails redirection is reverted to the packaged line
  ansible.builtin.lineinfile:
    path: /etc/aliases
    regexp: "^#?root:"
    line: "#root:\t\tmarc"
  register: _postfix_aliases_default
  when: common_mail_smtp_send_to is not defined

- name: Check if Postfix SASL passwords database exists
  ansible.builtin.stat:
    path: /etc/postfix/sasl_passwd.db
  register: _postfix_sasl_passwd_db
  when: common_mail_smtp_user is defined

- name: Ensure Postfix SASL passwords are reloaded
  ansible.builtin.command: postmap /etc/postfix/sasl_passwd
  changed_when: false
  when:
    - common_mail_smtp_user is defined
    - _postfix_sasl_passwd.changed or not _postfix_sasl_passwd_db.stat.exists

- name: Ensure Postfix SASL passwords are secured
  ansible.builtin.file:
    path: /etc/postfix/sasl_passwd.db
    owner: root
    group: root
    mode: '0600'
  register: _postfix_sasl
  when: common_mail_smtp_user is defined

- name: Ensure Postfix aliases are reloaded
  ansible.builtin.command: newaliases
  changed_when: false
  when: _postfix_aliases.changed or _postfix_aliases_default.changed  # noqa no-handler

- name: Ensure Postfix RPM package files metadata are in sync
  ansible.builtin.command: rpm --restore postfix setup # noqa command-instead-of-module
  changed_when: false

- name: Ensure Postfix service parent directory is present
  ansible.builtin.file:
    path: /etc/systemd/system/postfix.service.d
    state: directory

- name: Ensure Postfix systemd service configuration is present
  ansible.builtin.copy:
    src: postfix_service.conf
    dest: /etc/systemd/system/postfix.service.d/postfix.conf
  register: _postfix_systemd

- name: Ensure postfix service is restarted
  ansible.builtin.systemd:
    name: postfix
    state: restarted
    enabled: true
    daemon_reload: "{{ _postfix_systemd.changed | bool }}"
  when: >-
    _postfix_aliases.changed or _postfix_aliases_default.changed or _postfix_sasl.changed
    or _postfix_sasl_absent.changed or _postfix_systemd.changed
    or _postfix_main_cf.changed or _postfix_main_cf_deprecated.changed

- name: Ensure Postfix "rpmnew" files are absent
  ansible.builtin.file:
    path: "{{ item }}.rpmnew"
    state: absent
  with_items:
    - /etc/postfix/main.cf
    - /etc/aliases

- name: Ensure Postfix "rpmsave" files are absent
  ansible.builtin.file:
    path: "{{ item }}.rpmsave"
    state: absent
  with_items:
    - /etc/postfix/main.cf
    - /etc/aliases
