---

- name: Ensure cachefilesd is installed
  ansible.builtin.dnf:
    state: "{{ common_fs_cache | bool | ternary('present', 'absent') }}"
    name: cachefilesd
    install_weak_deps: false
  retries: 10
  delay: 1
  register: _
  until: _ is successful
  when: not (_ostree | bool)

- name: Ensure cachefilesd is installed
  ansible.builtin.include_tasks: ostree_packages.yml
  vars:
    _ostree_packages:
      - cachefilesd
  when:
    - common_fs_cache | bool
    - _ostree | bool

- name: Ensure cachefilesd is removed
  community.general.rpm_ostree_pkg:
    state: absent
    name: cachefilesd
  when:
    - not (common_fs_cache | bool)
    - _ostree | bool

- name: Ensure cachefilesd service is configured
  ansible.builtin.systemd:
    name: cachefilesd.service
    state: "{{ (_kernel_modules_locked | bool) | ternary(omit, 'started') }}"
    enabled: true
    daemon_reload: true
  when: common_fs_cache | bool
